  ctx.beginPath(); ctx.moveTo(x - 5, y - 6); ctx.lineTo(x - 8, y + 3); ctx.lineTo(x + 2, y - 6); ctx.closePath(); ctx.fill(); contorno(2);
  rr(x - 12, y - 28, 24, 23, 7); ctx.fill(); contorno(2);
  if (item === 'rosa') desenharRosa(x, y - 18, .85); else desenharVela(x, y - 14, .8);
}

function desenharCova(c) {
  let x = c.x, y = c.y;
  if (c.levantarEm != null && c.levantarEm < 2.2) { x += rnd(-2, 2); y += rnd(-1.5, 1.5); }
  const l = x - c.w / 2, t = y - c.h / 2;
  if (!c.corpo && c.prof <= 0) {
    ctx.setLineDash([5, 5]); rr(l, t, c.w, c.h, 6);
    ctx.strokeStyle = 'rgba(22,19,28,.28)'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  if (c.fechada && c.corpo) {
    rr(l + 3, t + 10, c.w - 6, c.h - 12, 12); ctx.fillStyle = COR.monte; ctx.fill(); contorno(2.5);
    rr(l + 8, t + 15, c.w - 16, 8, 4); ctx.fillStyle = 'rgba(255,230,200,.1)'; ctx.fill();
    const og = c.corpo.especie === 'ogro', lw = og ? 32 : 26;
    ctx.beginPath();
    ctx.moveTo(x - lw / 2, t + 14); ctx.lineTo(x - lw / 2, t - 4);
    ctx.arc(x, t - 4, lw / 2, Math.PI, 0); ctx.lineTo(x + lw / 2, t + 14); ctx.closePath();
    ctx.fillStyle = og ? COR.pedraOgro : COR.pedra; ctx.fill(); contorno(2.5);
    ctx.strokeStyle = 'rgba(22,19,28,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, t - 10); ctx.lineTo(x, t + 8); ctx.moveTo(x - 5, t - 4); ctx.lineTo(x + 5, t - 4); ctx.stroke();
    if (c.enfeite === 'rosa') desenharRosa(x, y + c.h / 2 - 14, 1.1);
    else if (c.enfeite === 'vela') desenharVela(x, y + c.h / 2 - 12, 1.1);
    else if (c.enfeite === 'apagada') desenharVela(x, y + c.h / 2 - 12, 1.1, true);
    return;
  }
  const k = Math.min(1, c.prof);
  ctx.fillStyle = COR.terra;
  ctx.beginPath(); ctx.ellipse(x + c.w / 2 + 5, y + 8, 6 + c.prof * 4, 10 + c.prof * 8, 0, 0, TAU); ctx.fill(); contorno(2);
  const hw = c.w * (.5 + .5 * k), hh = c.h * (.5 + .5 * k);
  rr(x - hw / 2, y - hh / 2, hw, hh, 5);
  ctx.fillStyle = COR.buraco[c.prof >= 2 ? 2 : c.prof >= 1 ? 1 : 0]; ctx.fill(); contorno(2.5);
  if (c.corpo && !c.levantou) {
    const og = c.corpo.especie === 'ogro';
    desenharCorpo(x, y, c.corpo.especie, Math.PI / 2, og ? .76 : .84);
    if (c.fechar > 0) {
      rr(x - hw / 2, y - hh / 2, hw, hh, 5);
      ctx.fillStyle = `rgba(110,74,43,${Math.min(1, c.fechar * 1.1)})`; ctx.fill();
    }
  }
  if (c.levantou) {
    ctx.fillStyle = COR.terra;
    [[-14, -30], [16, -26], [-18, 26], [12, 34]].forEach(([dx, dy]) => { circulo(x + dx, y + dy, 4); ctx.fill(); });
  }
}

function desenharCarroca() {
  ctx.fillStyle = COR.tinta;
  [[40, 150], [40, 340], [152, 150], [152, 340]].forEach(([x, y]) => { rr(x - 7, y - 20, 14, 40, 5); ctx.fill(); });
  rr(50, 100, 104, 300, 10); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  rr(44, 94, 104, 300, 10); ctx.fillStyle = COR.madeira; ctx.fill(); contorno(3);
  ctx.strokeStyle = 'rgba(22,19,28,.25)'; ctx.lineWidth = 1.5;
  for (let yy = 118; yy < 390; yy += 24) { ctx.beginPath(); ctx.moveTo(50, yy); ctx.lineTo(142, yy); ctx.stroke(); }
  texto('Carroça', 96, 76, 13, COR.osso, 600);
}

function desenharEstandes() {
  const r = ESTANDES[0];
  const moitas = [[-10, 4, 14], [9, 2, 15], [0, -8, 14], [-2, 9, 13]];
  moitas.forEach(([dx, dy, rad]) => { circulo(r.x + dx, r.y + dy, rad); contorno(5); });
  ctx.fillStyle = '#3f6b2c';
  moitas.forEach(([dx, dy, rad]) => { circulo(r.x + dx, r.y + dy, rad); ctx.fill(); });
  [[-12, 0], [5, -11], [11, 6], [-4, 11], [-1, -2]].forEach(([dx, dy]) => {
    circulo(r.x + dx, r.y + dy, 4.2); ctx.fillStyle = '#c8323c'; ctx.fill(); contorno(1.3);
  });
  texto('Rosas', r.x, r.y + 30, 12, COR.osso, 600);
  const v = ESTANDES[1];
  rr(v.x - 22, v.y - 12, 44, 30, 4); ctx.fillStyle = COR.madeira; ctx.fill(); contorno(2.5);
  ctx.strokeStyle = 'rgba(22,19,28,.3)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(v.x - 20, v.y + 3); ctx.lineTo(v.x + 20, v.y + 3); ctx.stroke();
  [-11, 0, 11].forEach(dx => desenharVela(v.x + dx, v.y - 8, 1));
  texto('Velas', v.x, v.y + 30, 12, COR.osso, 600);
}

function desenharLampiao(l) {
  sombra(l.x, l.y + 2, 8, 3);
  ctx.strokeStyle = COR.tinta; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - 28); ctx.stroke();
  rr(l.x - 6, l.y - 40, 12, 14, 3); ctx.fillStyle = COR.ambar; ctx.fill(); contorno(2);
  ctx.fillStyle = COR.tinta; ctx.beginPath(); ctx.moveTo(l.x - 8, l.y - 40); ctx.lineTo(l.x + 8, l.y - 40); ctx.lineTo(l.x, l.y - 47); ctx.closePath(); ctx.fill();
}

function desenharFerramenta(x, y, ang, nivel) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.lineCap = 'round';
  if (nivel === 1) {
    ctx.strokeStyle = COR.madeiraEsc; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(28, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(26, -6); ctx.lineTo(37, -5); ctx.quadraticCurveTo(43, 0, 37, 5); ctx.lineTo(26, 6); ctx.closePath();
    ctx.fillStyle = '#b3b0bd'; ctx.fill(); contorno(1.8);
  } else {
    ctx.strokeStyle = COR.madeiraEsc; ctx.lineWidth = 3;
    [-3, 3].forEach(o => { ctx.beginPath(); ctx.moveTo(4, o); ctx.lineTo(28, o * .4); ctx.stroke(); });
    ctx.fillStyle = '#b3b0bd';
    [-1, 1].forEach(sg => { ctx.beginPath(); ctx.ellipse(33, sg * 3.5, 6, 3.5, 0, 0, TAU); ctx.fill(); contorno(1.8); });
  }
  ctx.restore();
}

function desenharEscavadeira(q) {
  const x = q.x, y = q.y;
  ctx.fillStyle = COR.tinta;
  rr(x - 22, y - 16, 44, 8, 3); ctx.fill(); rr(x - 22, y + 12, 44, 8, 3); ctx.fill();
  rr(x - 18, y - 12, 36, 28, 5); ctx.fillStyle = '#e0a526'; ctx.fill(); contorno(2.5);
  const a = q.dir + (q.trabalhando ? Math.sin(tempo * 10) * .3 : 0);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  rr(8, -3.5, 26, 7, 3); ctx.fillStyle = '#e0a526'; ctx.fill(); contorno(2);
  ctx.beginPath(); ctx.moveTo(32, -8); ctx.lineTo(42, -6); ctx.lineTo(42, 6); ctx.lineTo(32, 8); ctx.closePath();
  ctx.fillStyle = '#6d6a77'; ctx.fill(); contorno(2);
  ctx.restore();
}

function desenharFantasma(q) {
  const x = q.x, y = q.y - 8 + Math.sin(tempo * 2.4 + x) * 3;
  ctx.save(); ctx.globalAlpha = .6;
  ctx.beginPath(); ctx.arc(x, y - 4, 12, Math.PI, 0); ctx.lineTo(x + 12, y + 12);
  for (let k = 0; k < 4; k++) ctx.quadraticCurveTo(x + 9 - k * 6, y + 6, x + 6 - k * 6, y + 12);
  ctx.closePath(); ctx.fillStyle = COR.osso; ctx.fill(); contorno(2);
  ctx.fillStyle = COR.tinta;
  circulo(x - 4, y - 3, 1.8); ctx.fill();
  circulo(x + 4, y - 3, 1.8); ctx.fill();
  ctx.restore();
}

function desenharCoveiro(q) {
  if (q.caido) { desenharFantasma(q); return; }
  const x = q.x, y = q.y, nivel = nivelFerr;
  const bob = q.andando ? Math.sin(tempo * 16 + x * .01) * 1.4 : 0;
  ctx.save();
  if (q.inv > 0 && Math.floor(tempo * 20) % 2) ctx.globalAlpha = .45;
  sombra(x, y + 13, 15, 5);
  if (nivel === 3) desenharEscavadeira(q);
  const balanco = q.trabalhando ? Math.sin(tempo * 14) * .6 : 0;
  if (nivel === 1 || nivel === 2) desenharFerramenta(x, y + bob, q.dir + .9 + balanco, nivel);
  ctx.beginPath(); ctx.ellipse(x, y + 2 + bob * .3, 13, 12, 0, 0, TAU); ctx.fillStyle = corSegura(q.cor); ctx.fill(); contorno(2.5);
  const hx = x + Math.cos(q.dir) * 2, hy = y - 7 + bob;
  circulo(hx, hy, 8.5); ctx.fillStyle = '#e8c49a'; ctx.fill(); contorno(2.2);
  ctx.fillStyle = COR.tinta;
  const ox = Math.cos(q.dir) * 3;
  circulo(hx - 3 + ox, hy + 2, 1.3); ctx.fill();
  circulo(hx + 3 + ox, hy + 2, 1.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx, hy - 4, 12, 4.5, 0, 0, TAU); ctx.fillStyle = '#231e2b'; ctx.fill(); contorno(2);
  rr(hx - 6.5, hy - 14, 13, 10, 3); ctx.fillStyle = '#231e2b'; ctx.fill(); contorno(2);
  const leva = q.carrega;
  if (leva && leva.tipo === 'corpo') desenharCorpo(x, y - 28 + bob, leva.corpo.especie, 0, .72);
  else if (leva && leva.tipo === 'item') {
    const ix = x + Math.cos(q.dir) * 16, iy = y + Math.sin(q.dir) * 10 + 2;
    if (leva.item === 'rosa') desenharRosa(ix, iy, 1.1); else desenharVela(ix, iy, 1.1);
  }
  if (q.golpe > 0) {
    ctx.strokeStyle = `rgba(239,230,210,${Math.min(1, q.golpe / .16 + .2)})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, 36, q.dir - .9, q.dir + .9); ctx.stroke();
  }
  ctx.restore();
}

function desenharZumbi(e) {
  const og = e.especie === 'ogro', r = e.r, sway = Math.sin(tempo * 6 + e.x * .1) * 1.5;
  const pele = og ? '#6f8f4c' : '#8aa47a';
  sombra(e.x, e.y + r * .9, r, r * .35);
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.dir); ctx.lineCap = 'round';
  [[og ? 9 : 7, COR.tinta], [og ? 6 : 4.5, pele]].forEach(([lw, cor]) => {
    ctx.strokeStyle = cor; ctx.lineWidth = lw;
    [-1, 1].forEach(sg => { ctx.beginPath(); ctx.moveTo(0, sg * r * .55); ctx.lineTo(r + 9, sg * r * .5 + sway); ctx.stroke(); });
  });
  ctx.restore();
  circulo(e.x, e.y, r); ctx.fillStyle = COR.mortalha; ctx.fill(); contorno(2.5);
  ctx.strokeStyle = 'rgba(22,19,28,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(e.x - r * .7, e.y + r * .2); ctx.lineTo(e.x + r * .6, e.y + r * .5); ctx.stroke();
  const hx = e.x + Math.cos(e.dir) * r * .25, hy = e.y - r * .35;
  circulo(hx, hy, r * .62); ctx.fillStyle = pele; ctx.fill(); contorno(2.2);
  ctx.fillStyle = '#e9e36a';
  const ox = Math.cos(e.dir) * r * .15;
  circulo(hx - r * .22 + ox, hy + r * .05, og ? 2.6 : 2); ctx.fill();
  circulo(hx + r * .22 + ox, hy + r * .05, og ? 2.6 : 2); ctx.fill();
  if (og) {
    ctx.fillStyle = COR.osso;
    [-1, 1].forEach(sg => { ctx.beginPath(); ctx.moveTo(hx + sg * r * .2, hy + r * .3); ctx.lineTo(hx + sg * r * .28, hy + r * .62); ctx.lineTo(hx + sg * r * .08, hy + r * .36); ctx.closePath(); ctx.fill(); });
  }
  if (e.flash > 0) { circulo(e.x, e.y, r + 2); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill(); }
}

// O ladrão comum tem r 13; o brutamontes é o mesmo desenho maior e de listra vermelha
function desenharLadrao(e) {
  const r = e.r, k = r / 13, bruto = e.especie === 'brutamontes';
  sombra(e.x, e.y + r * .9, r, r * .35);
  const sacoR = (e.saque > 0 ? 9 : 6) * k;
  const sx = e.x - Math.cos(e.dir) * 12 * k, sy = e.y - Math.sin(e.dir) * 12 * k - 2;
  circulo(sx, sy, sacoR); ctx.fillStyle = '#9b7a4a'; ctx.fill(); contorno(2);
  if (e.saque > 0) texto('$', sx, sy + 1, 11 * k, COR.ambar, 700);
  ctx.save(); circulo(e.x, e.y, r); ctx.clip();
  ctx.fillStyle = '#ece5d3'; ctx.fillRect(e.x - r, e.y - r, 2 * r, 2 * r);
  ctx.fillStyle = bruto ? '#8e2b33' : '#1b1820';
  for (let yy = -r; yy < r; yy += 6 * k) ctx.fillRect(e.x - r, e.y + yy, 2 * r, 3 * k);
  ctx.restore();
  circulo(e.x, e.y, r); contorno(2.5);
  const hx = e.x + Math.cos(e.dir) * 2 * k, hy = e.y - 7 * k;
  circulo(hx, hy, 8 * k); ctx.fillStyle = '#d9b08a'; ctx.fill(); contorno(2);
  ctx.fillStyle = '#1b1820'; ctx.beginPath(); ctx.arc(hx, hy - k, 8.4 * k, Math.PI, 0); ctx.fill();
  rr(hx - 8.5 * k, hy - k, 17 * k, 5 * k, 2.5 * k); ctx.fillStyle = '#1b1820'; ctx.fill();
  ctx.fillStyle = COR.osso;
  circulo(hx - 3 * k, hy + 1.5 * k, 1.4 * k); ctx.fill();
  circulo(hx + 3 * k, hy + 1.5 * k, 1.4 * k); ctx.fill();
  if (bruto) { ctx.strokeStyle = '#8e2b33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hx - 4, hy + 6 * k); ctx.lineTo(hx + 4, hy + 5 * k); ctx.stroke(); }
  if (e.flash > 0) { circulo(e.x, e.y, r + 2); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill(); }
}

// Chefão: ladrão gigante de cartola, bigode e um saco enorme
function desenharChefe(e) {
  const r = e.r, k = r / 13;
  const tremido = e.estado === 'mirando' && !reduzMov ? rnd(-1.5, 1.5) : 0;
  const x = e.x + tremido, y = e.y;
  sombra(x, y + r * .9, r * 1.05, r * .36);
  // saco nas costas; levanta acima da cabeça quando vai arremessar
  const ergue = e.estado === 'arremessando' ? Math.min(1, e.prog * 1.6) : 0;
  const sx = x - Math.cos(e.dir) * 14 * (1 - ergue), sy = y - Math.sin(e.dir) * 14 * (1 - ergue) - 4 - ergue * (r + 14);
  circulo(sx, sy, 16 + Math.min(10, e.saque * .15)); ctx.fillStyle = '#9b7a4a'; ctx.fill(); contorno(2.5);
  texto('$', sx, sy + 1, 17, COR.ambar, 700);
  ctx.save(); circulo(x, y, r); ctx.clip();
  ctx.fillStyle = '#ece5d3'; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  ctx.fillStyle = '#1b1820';
  for (let yy = -r; yy < r; yy += 12) ctx.fillRect(x - r, y + yy, 2 * r, 6);
  ctx.restore();
  circulo(x, y, r); contorno(3);
  const hx = x + Math.cos(e.dir) * 4, hy = y - 7 * k;
  circulo(hx, hy, 7.5 * k); ctx.fillStyle = '#d9b08a'; ctx.fill(); contorno(2.5);
  rr(hx - 8 * k, hy - 2 * k, 16 * k, 4.5 * k, 2 * k); ctx.fillStyle = '#1b1820'; ctx.fill();
  ctx.fillStyle = e.estado === 'mirando' || e.estado === 'golpe' ? COR.sangue : COR.osso;
  circulo(hx - 3 * k, hy, 1.3 * k); ctx.fill();
  circulo(hx + 3 * k, hy, 1.3 * k); ctx.fill();
  // bigode
  ctx.fillStyle = '#1b1820';
  [-1, 1].forEach(sg => { ctx.beginPath(); ctx.ellipse(hx + sg * 5, hy + 4 * k, 6, 2.6, sg * .35, 0, TAU); ctx.fill(); });
  // cartola
  ctx.beginPath(); ctx.ellipse(hx, hy - 6 * k, 11 * k, 3 * k, 0, 0, TAU); ctx.fillStyle = '#1b1820'; ctx.fill(); contorno(2);
  rr(hx - 6.5 * k, hy - 17 * k, 13 * k, 11 * k, 2); ctx.fill(); contorno(2);
  ctx.fillStyle = '#8e2b33'; ctx.fillRect(hx - 6.5 * k, hy - 9 * k, 13 * k, 2.2 * k);
  if (e.estado === 'tonto') {
    for (let i = 0; i < 3; i++) {
      const a = tempo * 4 + i * TAU / 3;
      texto('*', hx + Math.cos(a) * 20, hy - 18 * k + Math.sin(a) * 6, 20, COR.ambar, 700);
    }
  }
  if (e.flash > 0) { circulo(x, y, r + 2); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill(); }
}

// Avisos dos ataques do chefe e os perigos no chão. Ficam por cima do escuro para dar para ver chegando
function desenharAvisosChefe() {
  const cf = CFG.chefe;
  inimigos.forEach(e => {
    if (e.tipo !== 'chefe') return;
    if (e.estado === 'mirando') {
      const len = cf.investida.alcance + e.r, w = e.r * 2 + 10;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.dir);
      rr(0, -w / 2, len, w, w / 2); ctx.fillStyle = `rgba(224,82,90,${.12 + .28 * e.prog})`; ctx.fill();
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -tempo * 40;
      ctx.strokeStyle = 'rgba(224,82,90,.9)'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.setLineDash([]);
      rr(0, -w / 2, len * e.prog, w, w / 2); ctx.fillStyle = 'rgba(224,82,90,.22)'; ctx.fill();
      ctx.restore();
    } else if (e.estado === 'golpe') {
      const alc = e.r + cf.golpe.alcance; // encostou o corpo no vermelho, apanha
      circulo(e.x, e.y, alc); ctx.fillStyle = `rgba(224,82,90,${.1 + .25 * e.prog})`; ctx.fill();
      ctx.strokeStyle = 'rgba(224,82,90,.9)'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  });
  perigos.forEach(h => {
    const k = Math.max(0, Math.min(1, h.t / (h.tipo === 'bomba' ? h.dur : cf.estrepes.voo)));
    if (h.tipo === 'bomba') {
      const R = cf.bombas.raio;
      circulo(h.x, h.y, R); ctx.fillStyle = 'rgba(224,82,90,.14)'; ctx.fill();
      ctx.strokeStyle = 'rgba(224,82,90,.9)'; ctx.lineWidth = 2.5; ctx.stroke();
      circulo(h.x, h.y, R * k); ctx.fillStyle = 'rgba(224,82,90,.3)'; ctx.fill();
      if (h.t < 0) return;
      const bx = h.ox + (h.x - h.ox) * k, by = h.oy + (h.y - h.oy) * k - Math.sin(Math.PI * k) * 130;
      circulo(bx, by, 8); ctx.fillStyle = '#1b1820'; ctx.fill(); contorno(2);
      ctx.strokeStyle = COR.madeira; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx + 4, by - 6); ctx.lineTo(bx + 7, by - 11); ctx.stroke();
      circulo(bx + 7, by - 12, 2.4 + Math.sin(tempo * 30) * .8); ctx.fillStyle = COR.ambar; ctx.fill();
    } else if (k < 1) {
      circulo(h.x, h.y, 10); ctx.strokeStyle = 'rgba(224,82,90,.7)'; ctx.lineWidth = 2; ctx.stroke();
      if (h.t < 0) return;
      const bx = h.ox + (h.x - h.ox) * k, by = h.oy + (h.y - h.oy) * k - Math.sin(Math.PI * k) * 80;
      desenharEstrepe(bx, by, tempo * 12);
    } else {
      const some = h.dur - h.t < 1.5 && Math.floor(tempo * 8) % 2;
      if (!some) desenharEstrepe(h.x, h.y, h.x);
    }
  });
}
function desenharEstrepe(x, y, giro) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(giro);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8, R = i % 2 ? 3 : 9; ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
  ctx.closePath(); ctx.fillStyle = '#b3b0bd'; ctx.fill();
  ctx.strokeStyle = COR.sangue; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();
}

function desenharMoeda(m) {
  const k = Math.min(1, m.t / MOEDA_VOO);
  const x = m.ox + (m.x - m.ox) * k, y = m.oy + (m.y - m.oy) * k - Math.sin(Math.PI * k) * 26;
  const gira = Math.abs(Math.cos(tempo * 3 + m.id));
  if (k >= 1) sombra(m.x, m.y + 5, 6, 2);
  ctx.beginPath(); ctx.ellipse(x, y, 6 * (.35 + .65 * gira), 6, 0, 0, TAU);
  ctx.fillStyle = COR.ambar; ctx.fill(); contorno(1.8);
  if (gira > .6) { ctx.fillStyle = '#fff3c4'; ctx.fillRect(x - 1, y - 3, 2, 6); }
}

function desenharSoltas() {
  soltas.forEach(s => {
    if (s.t < 0) return;
    const a = 1 - Math.max(0, (s.t - (s.vida - .5)) / .5);
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    if (s.tipo === 'rosa') { ctx.translate(s.x, s.y); ctx.rotate(s.rot); desenharRosa(0, 0, 1.1); }
    else if (s.tipo === 'petala') { ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.beginPath(); ctx.ellipse(0, 0, 3.2, 1.8, 0, 0, TAU); ctx.fillStyle = '#c8323c'; ctx.fill(); }
    else if (s.tipo === 'fumaca') {
      ctx.globalAlpha = Math.max(0, .5 * (1 - s.t / s.vida));
      circulo(s.x, s.y, 4 + s.t * 10); ctx.fillStyle = '#cfccd8'; ctx.fill();
    } else if (s.tipo === 'clarao') {
      const k = s.t / s.vida;
      circulo(s.x, s.y, 20 + k * 40); ctx.fillStyle = `rgba(242,181,68,${.8 * (1 - k)})`; ctx.fill();
      circulo(s.x, s.y, 10 + k * 22); ctx.fillStyle = `rgba(255,243,196,${1 - k})`; ctx.fill();
    }
    ctx.restore();
  });
}

// Rajadas e folhas: desenhadas na tela, por cima de tudo
function desenharVento() {
  if (!rajadas.length && !folhas.length) return;
  ctx.lineCap = 'round';
  rajadas.forEach(r => {
    const a = r.a * Math.min(1, r.t * 5) * Math.min(1, ventoVis * 1.5);
    if (a <= .01) return;
    ctx.strokeStyle = `rgba(239,230,210,${a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x - r.len, r.y);
    ctx.quadraticCurveTo(r.x - r.len / 2, r.y + Math.sin(r.fase + r.t * 8) * 6, r.x, r.y);
    ctx.stroke();
  });
  folhas.forEach(f => {
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.4, 0, 0, TAU); ctx.fillStyle = f.cor; ctx.fill();
    ctx.restore();
  });
}

// Setas na borda da tela para quem está fora dela
function desenharSetas() {
  const setas = [];
  inimigos.forEach(e => setas.push([e.x, e.y, e.tipo === 'chefe' ? 14 : 10, COR.sangue]));
  if (modo !== 'solo') jogadores.forEach(q => { if (q !== p && !q.caido) setas.push([q.x, q.y, 9, corSegura(q.cor)]); });
  setas.forEach(([x, y, t, cor]) => {
    const sx = x - camDesenho;
    if (sx >= -8 && sx <= W + 8) return;
    const d = sx < 0 ? -1 : 1, ax = sx < 0 ? 16 : W - 16, ay = Math.max(52, Math.min(H - 16, y));
    ctx.beginPath(); ctx.moveTo(ax + d * t, ay); ctx.lineTo(ax - d * t * .6, ay - t); ctx.lineTo(ax - d * t * .6, ay + t); ctx.closePath();
    ctx.fillStyle = cor; ctx.fill(); contorno(2);
  });
}

function barraChefe() {
  const e = inimigos.find(o => o.tipo === 'chefe');
  if (!e) return;
  const w = Math.min(420, W - 120), x = (W - w) / 2, y = H - 30;
  // fica transparente quando o chefe ou o coveiro passam por baixo dela
  ctx.save(); ctx.globalAlpha = e.y > H - 100 || p.y > H - 70 ? .3 : 1;
  rr(x - 4, y - 4, w + 8, 16, 8); ctx.fillStyle = 'rgba(22,19,28,.85)'; ctx.fill();
  rr(x, y, Math.max(0, w * e.vida / e.vidaMax), 8, 4); ctx.fillStyle = COR.sangue; ctx.fill();
  texto('Chefe dos ladrões', W / 2, y - 14, 14, COR.osso, 600);
  ctx.restore();
}

function barra(x, y, frac, cor, marca) {
  rr(x - 22, y - 4, 44, 8, 4); ctx.fillStyle = COR.tinta; ctx.fill();
  const w = 40 * Math.max(0, Math.min(1, frac));
  if (w > 0) { rr(x - 20, y - 2, w, 4, 2); ctx.fillStyle = cor; ctx.fill(); }
  if (marca) { ctx.fillStyle = COR.osso; ctx.fillRect(x - 20 + 40 * marca - 1, y - 5, 2, 10); }
}

function furo(x, y, r, forca) {
  const g = lg.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${forca})`);
  g.addColorStop(.65, `rgba(0,0,0,${forca * .75})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  lg.fillStyle = g; lg.beginPath(); lg.arc(x, y, r, 0, TAU); lg.fill();
}

function desenharEscuro() {
  if (escuro < .01) return;
  lg.globalCompositeOperation = 'source-over';
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.clearRect(0, 0, W, H);
  lg.fillStyle = `rgba(10,12,34,${escuro})`; lg.fillRect(0, 0, W, H);
  lg.globalCompositeOperation = 'destination-out';
  lg.setTransform(1, 0, 0, 1, -camDesenho, 0);
  jogadores.forEach(q => furo(q.x, q.y, q.caido ? 60 : 120, q.caido ? .5 : .92));
  lampioes.forEach(l => { if (naTela(l.x, 140)) furo(l.x, l.y - 12, CFG.raioLampiao + 22, 1); });
  covas.forEach(c => { if (c.fechada && c.enfeite === 'vela' && naTela(c.x)) furo(c.x, c.y + c.h / 2 - 20, 42, .8); });
  furo(ESTANDES[1].x, ESTANDES[1].y - 8, 46, .8);
  lg.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(luz, 0, 0, W, H);
  if (escuro > .3) {
    ctx.save(); ctx.translate(-camDesenho, 0); ctx.globalCompositeOperation = 'lighter';
    lampioes.forEach(l => {
      const g = ctx.createRadialGradient(l.x, l.y - 34, 0, l.x, l.y - 34, 70);
      g.addColorStop(0, 'rgba(242,181,68,.28)'); g.addColorStop(1, 'rgba(242,181,68,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y - 34, 70, 0, TAU); ctx.fill();
    });
    ctx.restore();
  }
}

function desenharAlvo(a) {
  ctx.strokeStyle = 'rgba(242,181,68,.9)'; ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]); ctx.lineDashOffset = -tempo * 20;
  if (a.tipo === 'cova') { const c = a.cova; rr(c.x - c.w / 2 - 6, c.y - c.h / 2 - 16, c.w + 12, c.h + 22, 9); ctx.stroke(); }
  else if (a.tipo === 'placa') { const ar = AREAS[a.area]; rr(ar.x + ar.w / 2 - 62, ar.y + ar.h / 2 - 40, 124, 92, 10); ctx.stroke(); }
  else {
    const o = a.tipo === 'slot' ? SLOTS[a.i] : ESTANDES.find(s => s.item === a.item);
    ctx.beginPath(); ctx.arc(o.x, o.y, a.tipo === 'slot' ? 40 : 30, 0, TAU); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
}

function desenhar() {
  const px = escala * dpr;
  ctx.setTransform(px, 0, 0, px, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (tremor > 0) ctx.translate(rnd(-1, 1) * tremor * 14, rnd(-1, 1) * tremor * 14);
  camDesenho = Math.round(camX * px) / px;

  // Mundo (sob o escuro)
  ctx.save(); ctx.translate(-camDesenho, 0);
  for (let k = Math.floor(camDesenho / PEDACO); k * PEDACO < camDesenho + W; k++) ctx.drawImage(pedacoChao(k), k * PEDACO, 0, PEDACO + 2, H);
  desenharAreas();
  if (escuro < .3) lampioes.forEach(l => {
    if (!naTela(l.x, 120)) return;
    ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(242,181,68,.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(l.x, l.y, CFG.raioLampiao, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  });
  covas.forEach(c => { if (dono[c.area] && naTela(c.x)) desenharCova(c); });
  desenharCarroca();
  fila.forEach((c, i) => { if (c) desenharCorpo(SLOTS[i].x, SLOTS[i].y, c.especie); });
  desenharEstandes();
  moedas.forEach(desenharMoeda);
  const jogando = estado === 'dia' || estado === 'noite';
  const alvo = jogando && !p.caido ? alvoAtual(p) : null;
  if (alvo) desenharAlvo(alvo);
  lampioes.forEach(l => { if (naTela(l.x)) desenharLampiao(l); });
  const ents = inimigos.map(e => ({ y: e.y, f: () => (e.tipo === 'zumbi' ? desenharZumbi(e) : e.tipo === 'chefe' ? desenharChefe(e) : desenharLadrao(e)) }));
  jogadores.forEach(q => ents.push({ y: q.y, f: () => desenharCoveiro(q) }));
  ents.sort((a, b) => a.y - b.y).forEach(o => o.f());
  desenharSoltas();
  ctx.restore();

  desenharEscuro();

  // Por cima do escuro: pedidos, avisos, barras e números
  ctx.save(); ctx.translate(-camDesenho, 0);
  desenharAvisosChefe();
  fila.forEach((c, i) => { if (c) balao(SLOTS[i].x + 44, SLOTS[i].y - 4, c.pedido); });
  jogadores.forEach(q => { if (!q.caido && q.carrega && q.carrega.tipo === 'corpo') balao(q.x + 30, q.y - 36, q.carrega.corpo.pedido); });
  if (modo !== 'solo') jogadores.forEach(q => { if (q !== p) texto(q.nome, q.x, q.y + 27, 11, COR.osso, 600); });
  covas.forEach(c => {
    if (!dono[c.area] || !c.corpo || c.levantou || c.enfeite === c.corpo.pedido || !naTela(c.x)) return;
    balao(c.x + 22, c.y - c.h / 2 - 2, c.corpo.pedido);
    if (c.levantarEm != null && c.levantarEm < 2.2) texto('!', c.x - 16, c.y - c.h / 2 - 12, 22, COR.sangue, 700);
  });
  if (alvo && alvo.tipo === 'cova') {
    const c = alvo.cova, by = c.y + c.h / 2 + 10;
    if (c.corpo && !c.fechada && !c.levantou && c.fechar > 0) barra(c.x, by, c.fechar, COR.osso);
    else if (!c.corpo && c.prof > 0 && c.prof < 2) barra(c.x, by, c.prof / 2, COR.ambar, .5);
  }
  inimigos.forEach(e => {
    if (e.tipo === 'ladrao' && e.estado === 'roubando') barra(e.x, e.y + e.r + 12, e.prog, COR.ambar);
    if (e.tipo !== 'chefe' && e.vidaMax && e.vida < e.vidaMax - .01) barra(e.x, e.y - e.r - 20, e.vida / e.vidaMax, COR.sangue);
  });
  flutuantes.forEach(f => {
    ctx.globalAlpha = 1 - Math.max(0, (f.t - .9) / .5);
    texto(f.txt, f.x, f.y, 15, f.cor, 700);
    ctx.globalAlpha = 1;
  });
  ctx.restore();

  // Na tela
  desenharVento();
  desenharSetas();
  barraChefe();
}

// ===== HUD e dica =====
const cache = {};
function pinta(id, prop, val) {
  const chave = id + '.' + prop;
  if (cache[chave] === val) return;
  cache[chave] = val;
  const el = $('#' + id);
  if (prop === 'width') el.style.width = val; else el[prop] = val;
}
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function atualizarHUD() {
  const fase = estado === 'pausa' ? estadoPausado : estado;
  pinta('hud-dia', 'textContent', `Dia ${dia} de ${CFG.dias}`);
  pinta('hud-fase', 'textContent', { dia: 'Dia', noite: 'Noite', loja: 'Anoitecer', amanhecer: 'Amanhecer', fim: 'Fim', sala: 'Sala' }[fase] || 'Dia');
  pinta('hud-fase', 'className', 'fase ' + (fase === 'noite' || fase === 'loja' ? 'noite' : 'dia'));
  const dur = fase === 'noite' ? duracaoNoite() : CFG.duracaoDia;
  const ativo = fase === 'dia' || fase === 'noite';
  pinta('hud-relogio', 'textContent', ativo ? fmt(relogio) : fmt(fase === 'loja' ? duracaoNoite() : CFG.duracaoDia));
  pinta('hud-barra', 'width', (ativo ? Math.max(0, relogio / dur) * 100 : 100).toFixed(1) + '%');
  pinta('hud-dinheiro', 'textContent', `$${dinheiro}`);
  pinta('hud-meta', 'textContent', `de $${meta}`);
  let v = '';
  for (let i = 0; i < CFG.vidaMax; i++) v += i < p.vida ? '♥' : '<span class="vazio">♥</span>';
  pinta('hud-vida', 'innerHTML', v);
  pinta('hud-ferramenta', 'textContent', ferramenta().nome);
  pinta('hud-bota', 'hidden', nivelBota === 0);
  pinta('hud-bota', 'textContent', bota().nome);
  pinta('hud-lampioes', 'textContent', `Lampiões ${estoque}`);
  pinta('hud-sala', 'hidden', modo === 'solo');
  pinta('hud-sala', 'textContent', `Sala ${codigoSala} · ${jogadores.length} ${jogadores.length === 1 ? 'coveiro' : 'coveiros'}`);
  pinta('dica', 'innerHTML', `<span>${textoDica()}</span>`);
  // antes do jogo, o HUD e a dica somem (mantêm o espaço para a tela não pular ao começar)
  const fora = estado === 'titulo' || estado === 'sala' || estado === 'conexao' ? 'fora' : '';
  pinta('hud', 'className', fora);
  pinta('dica', 'className', fora); // o span evita que o flex engula os espaços em volta do <b>
}

function textoDica() {
  if (estado !== 'dia' && estado !== 'noite') return '';
  if (p.caido) return 'Você caiu. Volta quando amanhecer.';
  const K = toque ? 'Ação' : 'Espaço';
  if (inimigoPerto(p, 40)) return `<b>${K}</b>: bater`;
  const a = alvoAtual(p), leva = p.carrega;
  const levaTxt = leva && leva.tipo === 'corpo' ? `Levando ${esc(leva.corpo.nome)}`
    : leva && leva.tipo === 'item' ? `Segurando ${ITEM[leva.item] || ''}` : '';
  let acao = '';
  if (a && a.tipo === 'slot') {
    const c = fila[a.i];
    if (c && !leva) acao = `<b>${K}</b>: pegar ${esc(c.nome)} (${c.especie === 'ogro' ? 'ogro' : 'humano'}, quer ${ITEM[c.pedido] || ''})`;
    else if (c && leva) acao = 'Mãos ocupadas';
    else if (!c && leva && leva.tipo === 'corpo') acao = `<b>${K}</b>: devolver pra carroça`;
  } else if (a && a.tipo === 'estande') {
    if (leva && leva.tipo === 'corpo') acao = 'Mãos ocupadas';
    else if (leva && leva.item === a.item) acao = `<b>${K}</b>: devolver ${ITEM[a.item]}`;
    else acao = `<b>${K}</b>: pegar ${ITEM[a.item]}`;
  } else if (a && a.tipo === 'placa') {
    const preco = CFG.precoTerreno(a.area);
    acao = dinheiro >= preco ? `<b>${K}</b>: comprar esse terreno por $${preco}` : `Terreno à venda por $${preco}. Faltam $${preco - dinheiro}.`;
  } else if (a && a.tipo === 'cova') {
    const c = a.cova;
    if (c.levantou) acao = 'Cova vazia. O morto saiu andando.';
    else if (!c.corpo) {
      const req = leva && leva.tipo === 'corpo' ? CFG.profundidade[leva.corpo.especie] : 0;
      if (req && c.prof >= req) acao = `<b>${K}</b>: botar ${esc(leva.corpo.nome)} na cova`;
      else if (c.prof < 2) acao = `Segura <b>${K}</b> pra cavar${req === 2 ? ' (ogro precisa de cova grande)' : ''}`;
      else acao = 'Cova grande pronta';
    } else if (!c.fechada) acao = `Segura <b>${K}</b> pra fechar a cova`;
    else if (c.enfeite !== c.corpo.pedido) {
      acao = leva && leva.tipo === 'item' && leva.item === c.corpo.pedido
        ? `<b>${K}</b>: colocar ${ITEM[leva.item]}`
        : c.enfeite === 'apagada' ? `A vela de ${esc(c.corpo.nome)} apagou. Tem vela nova lá embaixo, à esquerda.`
        : `${esc(c.corpo.nome)} quer ${ITEM[c.corpo.pedido] || ''}. Tem lá embaixo, à esquerda.`;
    } else acao = `${esc(c.corpo.nome)} descansa em paz`;
  }
  if (!acao && !levaTxt) return estado === 'noite' ? 'Protege as covas. Ladrão não chega perto de lampião.' : '';
  return [levaTxt, acao].filter(Boolean).join(' · ');
}

// ===== Tela e toque =====
function redimensionar() {
  const r = palco.getBoundingClientRect();
  if (!r.width || !r.height) return;
  escala = Math.min(r.width / W, r.height / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  tela.style.width = Math.floor(W * escala) + 'px';
  tela.style.height = Math.floor(H * escala) + 'px';
  tela.width = Math.floor(W * escala * dpr);
  tela.height = Math.floor(H * escala * dpr);
}
new ResizeObserver(redimensionar).observe(palco);
addEventListener('resize', redimensionar);

if (toque) {
  $('#toque').hidden = false;
  const zona = $('#joy-zona'), base = $('#joy-base'), pino = $('#joy-pino');
  let origem = null, idPtr = null;
  zona.addEventListener('pointerdown', e => {
    idPtr = e.pointerId; zona.setPointerCapture(idPtr);
    const r = zona.getBoundingClientRect();
    origem = { x: e.clientX, y: e.clientY };
    base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px';
    pino.style.transform = ''; base.hidden = false;
  });
  zona.addEventListener('pointermove', e => {
    if (e.pointerId !== idPtr || !origem) return;
    let dx = e.clientX - origem.x, dy = e.clientY - origem.y;
    const d = Math.hypot(dx, dy), m = 45;
    if (d > m) { dx = dx / d * m; dy = dy / d * m; }
    joy.x = dx / m; joy.y = dy / m;
    pino.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  const fimJoy = e => { if (e.pointerId !== idPtr) return; origem = null; idPtr = null; joy.x = 0; joy.y = 0; base.hidden = true; };
  zona.addEventListener('pointerup', fimJoy);
  zona.addEventListener('pointercancel', fimJoy);
  const bA = $('#btn-acao');
  bA.addEventListener('pointerdown', e => { e.preventDefault(); acaoToque = true; apertar(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => bA.addEventListener(t, () => { acaoToque = false; }));
  $('#btn-lampiao').addEventListener('pointerdown', e => { e.preventDefault(); pedirLampiao(); });
}

// ===== Começo =====
novoJogo();
redimensionar();
telaInicio = online && salaUrl ? 'multi' : 'inicio'; // quem chega por um link de convite cai direto no multiplayer
renderPainel();
let ultimo = performance.now();
function quadro(t) {
  const dt = Math.min(.05, Math.max(0, (t - ultimo) / 1000));
  ultimo = t;
  atualizar(dt);
  enviarMundo();
  desenhar();
  atualizarHUD();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
})();
</script>

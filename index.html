<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coveiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --tinta:#16131c;
  --tinta-2:#211c29;
  --tinta-3:#2c2536;
  --osso:#efe6d2;
  --osso-2:#b8ad97;
  --ambar:#f2b544;
  --sangue:#e0525a;
  --musgo:#8fb36a;
  --linha:rgba(239,230,210,.14);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--tinta);color:var(--osso);font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}
#hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;font-size:15px}
.hud-grupo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
#hud-dia{font-family:"Grenze Gotisch",Georgia,serif;font-weight:600;font-size:23px;line-height:1}
.fase{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px}
.fase.dia{background:var(--ambar);color:var(--tinta)}
.fase.noite{background:#3a4174;color:var(--osso)}
.relogio{width:120px;height:8px;border-radius:99px;background:var(--tinta-3);overflow:hidden}
#hud-barra{height:100%;width:100%;background:var(--osso-2)}
.dinheiro b{color:var(--ambar);font-size:21px;font-weight:700}
.dinheiro span{color:var(--osso-2);font-size:13px;margin-left:4px}
#hud-vida{color:var(--sangue);font-size:18px;letter-spacing:1px}
#hud-vida .vazio{color:var(--tinta-3)}
.chip{font-size:13px;padding:3px 10px;border:1px solid var(--linha);border-radius:999px;color:var(--osso-2)}
#palco{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#tela{display:block;border-radius:10px;box-shadow:0 0 0 1px var(--linha),0 18px 50px rgba(0,0,0,.45);touch-action:none}
#dica{height:44px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;font-size:15px;color:var(--osso-2);line-height:1.4}
#dica b{color:var(--osso);font-weight:600}
kbd{font-family:inherit;font-size:.85em;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--tinta-3);color:var(--osso);border:1px solid var(--linha);border-bottom-width:2px}
#aviso{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;padding:8px 14px;border-radius:10px;background:rgba(22,19,28,.9);border:1px solid var(--linha);font-size:14px;text-align:center;pointer-events:none;z-index:4}
#painel{position:absolute;inset:0;display:flex;overflow:auto;padding:12px;box-sizing:border-box;background:rgba(12,10,16,.5);z-index:5}
.cartao{margin:auto;width:min(580px,100%);box-sizing:border-box;background:var(--tinta-2);border:1px solid var(--linha);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sobre{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ambar)}
.cartao h1{margin:2px 0 0;font-family:"Grenze Gotisch",Georgia,serif;font-weight:800;font-size:clamp(56px,10vw,88px);line-height:.85;text-wrap:balance}
.cartao h2{margin:2px 0 0;font-family:"Grenze Gotisch",Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,46px);line-height:1;text-wrap:balance}
.cartao h3{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--osso-2)}
.cartao p{margin:0;line-height:1.5;font-size:16px;max-width:62ch}
.cartao ol{margin:0;padding-left:20px;line-height:1.55}
.cartao a{color:var(--ambar)}
.cartao .controles,.cartao .nota{font-size:14px;color:var(--osso-2)}
.cartao .espera{color:var(--osso-2)}
.blocos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 22px}
.botoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:10px;padding:12px 22px;background:var(--ambar);color:var(--tinta);cursor:pointer;align-self:flex-start}
.btn:hover{background:#f6c563}
.btn.sec{background:transparent;color:var(--osso);border:1px solid var(--linha)}
.btn.sec:hover{background:var(--tinta-3)}
.btn:focus-visible,.loja button:focus-visible{outline:3px solid var(--osso);outline-offset:2px}
.linha-nome,.entrar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cartao input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border-radius:9px;border:1px solid var(--linha);background:var(--tinta-3);color:var(--osso);width:11em;max-width:100%;box-sizing:border-box}
.cartao input[type=text]:focus-visible{outline:3px solid var(--ambar);outline-offset:1px}
#codigo{width:6.5em;text-transform:uppercase;letter-spacing:.15em}
.codigo-sala{font-size:44px;font-weight:700;letter-spacing:.14em;line-height:1.1;color:var(--ambar);-webkit-user-select:text;user-select:text}
.link-sala{font-family:ui-monospace,Consolas,monospace;font-size:14px;padding:10px 12px;border-radius:9px;background:var(--tinta-3);word-break:break-all;-webkit-user-select:text;user-select:text}
.jogadores{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.jogadores li{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 7px;border-radius:999px;background:var(--tinta-3);font-size:15px}
.jogadores i{width:14px;height:14px;border-radius:50%;border:2px solid var(--osso-2)}
.saldo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.saldo b{font-size:30px;color:var(--ambar);font-variant-numeric:tabular-nums}
.saldo span{color:var(--osso-2)}
.alerta{padding:10px 12px;border-radius:10px;background:var(--tinta-3);font-size:15px;line-height:1.45}
.loja{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.loja li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-radius:10px;background:var(--tinta-3)}
.loja li div{display:flex;flex-direction:column;gap:2px}
.loja small{color:var(--osso-2);font-size:13.5px;line-height:1.35}
.loja button{font:inherit;font-weight:700;font-size:16px;min-width:74px;padding:8px 12px;border-radius:9px;border:0;background:var(--ambar);color:var(--tinta);cursor:pointer;font-variant-numeric:tabular-nums}
.loja button:disabled{background:transparent;color:var(--osso-2);border:1px solid var(--linha);cursor:not-allowed}
.resumo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:16px}
.resumo li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--linha);padding-bottom:6px}
.resumo b{font-variant-numeric:tabular-nums}
#hud.fora,#dica.fora{visibility:hidden}
.cartao.inicio{width:min(440px,100%)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:10px;border:1px solid var(--linha);background:var(--tinta-3);color:var(--osso);cursor:pointer;text-align:left}
.menu b{font-size:19px;font-weight:600}
.menu small{font-size:13.5px;color:var(--osso-2)}
.menu button:hover{border-color:var(--osso-2)}
.menu button[data-principal]{background:var(--ambar);border-color:var(--ambar);color:var(--tinta)}
.menu button[data-principal] small{color:#5a4520}
.menu button:focus-visible{outline:3px solid var(--osso);outline-offset:2px}
.convite{padding:10px 12px;border-radius:10px;border:1px solid var(--ambar);font-size:15px}
.ajustes{display:grid;grid-template-columns:max-content minmax(0,1fr) 3em;align-items:center;gap:14px 12px;font-size:16px}
.ajuste{display:contents}
.ajuste input[type=range]{width:100%;margin:0;accent-color:var(--ambar);cursor:pointer}
.ajuste output{font-variant-numeric:tabular-nums;text-align:right;color:var(--osso-2)}
.ajuste-marca{grid-column:1/-1;display:flex;align-items:center;gap:10px;cursor:pointer}
.ajuste-marca input{width:18px;height:18px;margin:0;accent-color:var(--ambar)}
.ajustes input:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
#toque{position:absolute;inset:0;z-index:3;pointer-events:none}
#joy-zona{position:absolute;left:0;top:0;bottom:0;width:55%;pointer-events:auto;touch-action:none}
#joy-base{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(239,230,210,.25);background:rgba(22,19,28,.25)}
#joy-pino{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(239,230,210,.4)}
.btn-toque{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(239,230,210,.35);font:inherit;font-weight:600;color:var(--osso);background:rgba(22,19,28,.6)}
#btn-acao{right:14px;bottom:18px;width:84px;height:84px;font-size:16px;background:rgba(242,181,68,.85);color:var(--tinta)}
#btn-lampiao{right:110px;bottom:12px;width:62px;height:62px;font-size:12px}
@media (max-width:560px){#hud{font-size:13px}.relogio{width:64px}#hud-dia{font-size:19px}.dinheiro b{font-size:18px}}
</style>

<div id="app">
  <header id="hud">
    <div class="hud-grupo">
      <span id="hud-dia">Dia 1 de 5</span>
      <span id="hud-fase" class="fase dia">Dia</span>
      <div class="relogio" aria-hidden="true"><div id="hud-barra"></div></div>
      <span id="hud-relogio" class="num">2:00</span>
    </div>
    <div class="hud-grupo">
      <span class="dinheiro num"><b id="hud-dinheiro">$0</b><span id="hud-meta">de $200</span></span>
      <span id="hud-vida" aria-label="Vida"></span>
      <span id="hud-ferramenta" class="chip">Mãos</span>
      <span id="hud-bota" class="chip" hidden></span>
      <span id="hud-lampioes" class="chip">Lampiões 0</span>
      <span id="hud-sala" class="chip" hidden></span>
    </div>
  </header>
  <main id="palco">
    <canvas id="tela" aria-label="O cemitério"></canvas>
    <div id="aviso" hidden></div>
    <div id="toque" hidden>
      <div id="joy-zona"><div id="joy-base" hidden><div id="joy-pino"></div></div></div>
      <button id="btn-lampiao" class="btn-toque" type="button">Lampião</button>
      <button id="btn-acao" class="btn-toque" type="button">Ação</button>
    </div>
    <section id="painel" hidden></section>
  </main>
  <footer id="dica"></footer>
</div>

<script>
(() => {
'use strict';

// ===== Ajustes de balanceamento: mexa aqui =====
const CFG = {
  dias: 5,
  meta: 200,            // dívida jogando sozinho; online cresce 50% por coveiro a mais
  duracaoDia: 120,
  duracaoNoite: 60,     // teto: a noite acaba antes quando o cemitério fica limpo
  intervaloChegada: 20, // sozinho; online chega corpo mais rápido
  chanceOgro: 0.3,
  pagamento: { humano: 12, ogro: 26 },
  gorjeta: 5,
  profundidade: { humano: 1, ogro: 2 },
  cavarPorSeg: 0.16,
  fecharPorSeg: 0.5,
  velocidade: 165,
  vidaMax: 5,
  precoLampiao: 15,
  raioLampiao: 95,
  // Terreno sem fim: sempre há 2 à venda depois do último comprado, cada um mais caro (60, 100, 150, 225...)
  precoTerreno: i => (i === 0 ? 0 : i === 1 ? 60 : Math.round(20 * 1.5 ** (i - 2)) * 5),
  terrenosAVenda: 2,
  maxJogadores: 4,
  ferramentas: [
    { nome: 'Mãos', preco: 0, cavar: 1, dano: 1, desc: '' },
    { nome: 'Pá', preco: 35, cavar: 2, dano: 2, desc: 'Cava e fecha no dobro da velocidade. E bate mais forte.' },
    { nome: 'Cavadeira', preco: 90, cavar: 3, dano: 3, desc: 'Três vezes mais rápida que cavar na mão. Bate mais forte que a pá.' },
    { nome: 'Escavadeira', preco: 180, cavar: 5, dano: 5, desc: 'Cinco vezes mais rápida. Ogro nenhum aguenta.' },
  ],
  botas: [
    { nome: 'Botina', preco: 0, vel: 1, desc: '' },
    { nome: 'Bota de couro', preco: 25, vel: 1.2, desc: 'Anda 20% mais rápido.' },
    { nome: 'Bota de cano alto', preco: 60, vel: 1.4, desc: 'Anda 40% mais rápido.' },
    { nome: 'Bota de sete léguas', preco: 120, vel: 1.65, desc: 'Anda 65% mais rápido. Atravessa o cemitério num pulo.' },
  ],
  // Bichos da noite: poucos no começo, muitos no fim, e a cada dia com mais defesa e mais cura
  ladroes: d => Math.max(1, Math.round(0.25 * d * d + 0.75)), // 1, 2, 3, 5, 7
  chanceBrutamontes: d => Math.min(0.5, Math.max(0, 0.15 * (d - 2))), // aparece a partir do dia 3
  defesa: d => Math.min(0.6, 0.08 * (d - 1)), // parte do golpe que o bicho segura
  cura: d => 0.12 * (d - 1),                  // vida que o bicho recupera por segundo
  roubo: d => 8 + 2 * d,
  tempoRoubo: 5,
  ladrao: {
    comum: { vida: d => 2 + Math.floor(d / 3), vel: 92, r: 13, dano: 1, roubo: 1, peso: 1 },
    brutamontes: { vida: d => 6 + d, vel: 70, r: 18, dano: 2, roubo: 1.5, peso: 0.5 },
  },
  zumbi: {
    humano: { vida: 3, vel: 62, dano: 1, r: 13 },
    ogro: { vida: 8, vel: 46, dano: 2, r: 19 },
  },
  // Ladrão derrubado solta moedas no chão: o que ele levou mais um trocado. Passe por cima para pegar
  moedas: { ladrao: d => 2 + d, brutamontes: d => 6 + 2 * d, chefe: 40, valor: 3, pegar: 26 },
  // Chefão: vem na última noite. Todo ataque dele avisa antes de acertar
  chefe: {
    vida: 50, vel: 58, r: 34, chegaEm: 5, duracaoNoite: 100, roubo: 6,
    intervalo: [3, 4.5], // pausa entre um ataque especial e outro
    golpe: { preparo: 0.55, alcance: 30, dano: 2 },
    bombas: { n: 3, raio: 46, voo: 1.3, dano: 1 },
    investida: { mira: 0.9, vel: 540, alcance: 360, dano: 2, tonto: 1.4 },
    estrepes: { n: 6, voo: 0.6, dura: 9, dano: 1 },
  },
  // Eventos do dia: no máximo um por dia, sorteado quando o dia começa
  eventos: {
    vento: { desdeDia: 2, chance: 0.6, aviso: 3, velocidade: 300, pegaCova: 0.75 },
  },
};
// Endereço público do jogo, mostrado a quem abre pelo Claude (onde o online não funciona)
const LINK_ABERTO = 'https://lyiu-10.github.io/coveiro/';

// ===== Mundo =====
const W = 960, H = 560; // tamanho da tela; o mundo cresce para a direita conforme compra terreno
const AREA = { x0: 210, passo: 250, y: 60, w: 236, h: 460 };
const SLOTS = [0, 1, 2, 3].map(i => ({ x: 96, y: 132 + i * 72 }));
const ESTANDES = [{ item: 'rosa', x: 64, y: 474 }, { item: 'vela', x: 140, y: 474 }];
const CORES = ['#3d3550', '#2f6070', '#7a3b2e', '#56692f'];
const NOMES = {
  humano: ['Seu Juvenal', 'Dona Cotinha', 'Tio Nestor', 'Dona Filó', 'Seu Epaminondas', 'Dona Zuleica', 'Seu Tibúrcio', 'Dona Quitéria', 'Seu Anacleto', 'Dona Benedita', 'Seu Clodoaldo', 'Dona Ermelinda'],
  ogro: ['Grumbo', 'Belarmina, a Ogra', 'Brutálio', 'Tonelada', 'Gorgonzola', 'Dona Rochedo'],
};
const ITEM = { rosa: 'rosa vermelha', vela: 'vela' };
const COR = {
  tinta: '#16131c', osso: '#efe6d2', ambar: '#f2b544', sangue: '#e0525a',
  madeira: '#8a5a33', madeiraEsc: '#5e3c21', terra: '#7a5230', monte: '#6e4a2b',
  buraco: ['#5a3a22', '#3b2616', '#24160a'], pedra: '#9a96a6', pedraOgro: '#80907a', mortalha: '#e6dcc4',
};

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const escolha = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const corSegura = c => (/^#[0-9a-f]{6}$/i.test(c) ? c : CORES[0]);
const limparNome = s => String(s || '').replace(/[^\p{L}\p{N} ._-]/gu, '').trim().slice(0, 14) || 'Coveiro';
const reduzMov = matchMedia('(prefers-reduced-motion: reduce)').matches;
const toque = matchMedia('(pointer: coarse)').matches;
const online = !window.claude; // dentro do Claude a conexão direta é bloqueada
let salaUrl = (() => {
  try { return (new URLSearchParams(location.search).get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); }
  catch (e) { return ''; }
})();
function mulberry(s) {
  return () => {
    s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function lerNome() { try { return limparNome(localStorage.getItem('coveiro.nome')); } catch (e) { return 'Coveiro'; } }
function salvarNome(n) { try { localStorage.setItem('coveiro.nome', n); } catch (e) { /* sem armazenamento */ } }

// ===== Configurações (ficam só neste aparelho) =====
const CONFIG_PADRAO = { geral: 80, musica: 70, ambiente: 70, efeitos: 80, tremor: !reduzMov };
function lerConfig() {
  const c = Object.assign({}, CONFIG_PADRAO);
  try {
    const salvo = JSON.parse(localStorage.getItem('coveiro.config') || '{}');
    ['geral', 'musica', 'ambiente', 'efeitos'].forEach(k => { if (Number.isFinite(salvo[k])) c[k] = Math.max(0, Math.min(100, Math.round(salvo[k]))); });
    if (typeof salvo.tremor === 'boolean') c.tremor = salvo.tremor;
  } catch (e) { /* sem armazenamento: fica o padrão */ }
  return c;
}
function salvarConfig() { try { localStorage.setItem('coveiro.config', JSON.stringify(config)); } catch (e) { /* sem armazenamento */ } }
let config = lerConfig();

// ===== Som: um volume geral e três canais (música, ambiente, efeitos) =====
// Tudo é sintetizado aqui mesmo. Quando houver arquivos de áudio, é só trocar a receita em SONS ou tocar o arquivo no canal certo
const CANAIS = ['musica', 'ambiente', 'efeitos'];
const som = { ctx: null, geral: null, canais: {} };
function iniciarSom() {
  if (som.ctx) { if (som.ctx.state === 'suspended') som.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    som.ctx = new AC();
    // o limitador segura vários sons juntos sem distorcer
    const lim = som.ctx.createDynamicsCompressor();
    lim.threshold.value = -6; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = .003; lim.release.value = .25;
    lim.connect(som.ctx.destination);
    som.geral = som.ctx.createGain(); som.geral.connect(lim);
    CANAIS.forEach(k => { som.canais[k] = som.ctx.createGain(); som.canais[k].connect(som.geral); });
    aplicarVolumes();
  } catch (e) { som.ctx = null; }
}
const curva = v => (v / 100) ** 2; // o ouvido percebe volume em escala: 50% na barra soa como metade
function aplicarVolumes() {
  if (!som.ctx) return;
  som.geral.gain.value = curva(config.geral);
  CANAIS.forEach(k => { som.canais[k].gain.value = curva(config[k]); });
}
// O navegador só libera o som depois de um clique ou tecla; com a aba escondida, o som pausa
addEventListener('pointerdown', iniciarSom, { once: true });
addEventListener('keydown', iniciarSom, { once: true });
document.addEventListener('visibilitychange', () => {
  if (!som.ctx) return;
  if (document.hidden) som.ctx.suspend().catch(() => {}); else som.ctx.resume().catch(() => {});
});

// --- Peças de síntese ---
const midi = n => 440 * 2 ** ((n - 69) / 12);
// Um tom com ataque curto e queda: tipo, frequência inicial e final, e um filtro opcional para abafar
function tom(tipo, f0, t, dur, pico, destino, f1, corte) {
  const c = som.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pico, t + .006);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let saida = g;
  if (corte) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = corte; g.connect(f); saida = f; }
  o.connect(g); saida.connect(destino); o.start(t); o.stop(t + dur + .03);
}
let bufRuido = null;
function ruido() {
  if (bufRuido) return bufRuido;
  const c = som.ctx;
  bufRuido = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const d = bufRuido.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return bufRuido;
}
// Um chiado de ruído filtrado (pá na terra, golpe, explosão, vento)
function chiado(t, dur, pico, destino, filtro, f0, f1, q = 1) {
  const c = som.ctx, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  n.buffer = ruido(); f.type = filtro; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pico, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  n.connect(f); f.connect(g); g.connect(destino);
  n.start(t, Math.random() * .4); n.stop(t + dur + .03);
}

// --- Efeitos: cada receita recebe o instante e o destino ---
const SONS = {
  clique: (t, d) => tom('triangle', 900, t, .05, .14, d, 620),
  pop: (t, d) => tom('sine', 480, t, .1, .22, d, 900),
  cavar: (t, d) => chiado(t, .16, .3, d, 'bandpass', 1500, 650, .9),
  baque: (t, d) => { tom('sine', 150, t, .2, .45, d, 55); chiado(t, .1, .18, d, 'lowpass', 700); },
  moeda: (t, d) => { tom('square', 1318, t, .08, .14, d, 0, 5000); tom('square', 1760, t + .07, .25, .14, d, 0, 5000); },
  compra: (t, d) => { chiado(t, .05, .12, d, 'highpass', 3000); SONS.moeda(t + .04, d); },
  golpe: (t, d) => { chiado(t, .1, .45, d, 'lowpass', 1800, 300); tom('sine', 190, t, .13, .35, d, 70); },
  dor: (t, d) => tom('sawtooth', 300, t, .25, .24, d, 140, 1200),
  ladrao: (t, d) => { tom('sine', 1150, t, .12, .22, d, 1650); tom('sine', 1000, t + .16, .18, .22, d, 700); },
  roubo: (t, d) => { tom('triangle', 880, t, .12, .15, d, 440); tom('triangle', 620, t + .13, .2, .15, d, 300); },
  gemido: (t, d) => tom('sawtooth', 120, t, 1, .14, d, 78, 500),
  chefe: (t, d) => { tom('sawtooth', 98, t, 1.2, .28, d, 62, 700); tom('sawtooth', 147, t + .05, 1.1, .18, d, 92, 700); },
  alerta: (t, d) => tom('square', 440, t, .28, .16, d, 900, 2500),
  arremesso: (t, d) => chiado(t, .3, .6, d, 'bandpass', 500, 2600, 2),
  explosao: (t, d) => { chiado(t, .7, .65, d, 'lowpass', 2200, 110); tom('sine', 95, t, .55, .55, d, 32); },
  sino: (t, d) => [1, 2.76, 5.4].forEach((k, i) => tom('sine', 196 * k, t, 2.4 - i * .6, [.3, .12, .06][i], d)),
  manha: (t, d) => [523, 659, 784].forEach((f, i) => tom('triangle', f, t + i * .1, .55, .13, d)),
  vitoria: (t, d) => [523, 659, 784, 1047].forEach((f, i) => tom('triangle', f, t + i * .13, i === 3 ? 1.1 : .5, .16, d)),
  derrota: (t, d) => [392, 370, 349, 330].forEach((f, i) => tom('triangle', f, t + i * .38, i === 3 ? 1.2 : .42, .16, d, i === 3 ? 290 : 0)),
  grilo: (t, d) => { for (let i = 0; i < 3; i++) tom('sine', 4400, t + i * .055, .035, .06, d); },
  passaro: (t, d) => { tom('sine', 2300, t, .1, .07, d, 3100); tom('sine', 2600, t + .14, .08, .06, d, 3300); },
};
const ultimoSom = {};
// Toca um efeito aqui; com x, fica mais baixo quanto mais longe da câmera
function tocarLocal(nome, x) {
  if (!som.ctx || som.ctx.state !== 'running' || !Object.prototype.hasOwnProperty.call(SONS, nome)) return;
  const agora = som.ctx.currentTime;
  if (agora - (ultimoSom[nome] || -1) < .045) return; // o mesmo som várias vezes no mesmo instante vira um só
  ultimoSom[nome] = agora;
  let vol = 1;
  if (x != null) { vol = Math.min(1, 1.35 - Math.abs(x - (camX + W / 2)) / 700); if (vol <= .05) return; }
  const g = som.ctx.createGain(); g.gain.value = vol * 1.6; g.connect(som.canais.efeitos);
  try { SONS[nome](agora + .01, g); } catch (e) { /* receita quebrada não derruba o jogo */ }
}
// Toca e, no online, manda o anfitrião tocar também nos convidados
function tocar(nome, x) {
  tocarLocal(nome, x);
  if (modo === 'anfitriao') eventos.push({ s: [nome, x == null ? null : Math.round(x)] });
}

// --- Música: valsinha de caixinha em lá menor. À noite desce uma oitava e fica mais lenta ---
const VALSA = [ // [acorde, baixo, melodia em [nota, tempos]] por compasso de 3 tempos
  [[57, 60, 64], 45, [[69, 1], [72, 1], [76, 1]]],
  [[57, 60, 64], 45, [[75, 1], [76, 2]]],
  [[57, 62, 65], 50, [[77, 1], [76, 1], [74, 1]]],
  [[56, 59, 64], 40, [[71, 2], [68, 1]]],
  [[57, 60, 64], 45, [[69, 1], [72, 1], [76, 1]]],
  [[57, 60, 65], 41, [[77, 1], [76, 1], [72, 1]]],
  [[56, 59, 64], 40, [[71, 1], [74, 1], [68, 1]]],
  [[57, 60, 64], 45, [[69, 3]]],
  [[57, 60, 65], 41, [[77, 1], [76, 1], [77, 1]]],
  [[55, 60, 64], 48, [[79, 2], [76, 1]]],
  [[57, 62, 65], 50, [[74, 1], [77, 1], [74, 1]]],
  [[56, 59, 64], 40, [[76, 2], [71, 1]]],
  [[57, 60, 64], 45, [[72, 1], [71, 1], [69, 1]]],
  [[57, 62, 65], 50, [[74, 1], [72, 1], [71, 1]]],
  [[56, 59, 62], 40, [[68, 1], [71, 1], [74, 1]]],
  [[57, 60, 64], 45, [[69, 2], [0, 1]]],
];
const musica = { proxima: 0, compasso: 0, noite: false };
function tocarCompasso(i, t) {
  const [acorde, baixo, mel] = VALSA[i], noite = musica.noite, tempo = 60 / (noite ? 104 : 132), d = som.canais.musica;
  tom('triangle', midi(baixo), t, tempo * .9, .28, d);
  if (noite) acorde.forEach(n => tom('triangle', midi(n), t + tempo, tempo * 1.9, .045, d, 0, 900));
  else [1, 2].forEach(k => acorde.forEach(n => tom('square', midi(n), t + k * tempo, tempo * .35, .03, d, 0, 1400)));
  let s = 0;
  mel.forEach(([n, dur]) => {
    if (n) tom(noite ? 'sine' : 'triangle', midi(noite ? n - 12 : n), t + s * tempo, dur * tempo * .95, noite ? .22 : .18, d);
    s += dur;
  });
  return 3 * tempo;
}
function agendarMusica() {
  if (!som.ctx || som.ctx.state !== 'running') return;
  const agora = som.ctx.currentTime;
  if (musica.proxima < agora) musica.proxima = agora + .05; // voltou de uma pausa: recomeça sem atropelar
  while (musica.proxima < agora + .3) {
    musica.proxima += tocarCompasso(musica.compasso, musica.proxima);
    musica.compasso = (musica.compasso + 1) % VALSA.length;
  }
}
setInterval(agendarMusica, 100);

// --- Ambiente e o que muda com a fase: grilo à noite, passarinho de dia, vento na ventania, pá cavando ---
let ventoSom = null, faseSom = '', tCavar = 0;
function atualizarSom(dt) {
  if (!som.ctx || som.ctx.state !== 'running') return;
  const fase = estado === 'pausa' ? estadoPausado : estado;
  musica.noite = fase === 'noite';
  if (fase !== faseSom) {
    if (fase === 'loja') tocarLocal('sino');
    else if (fase === 'amanhecer') tocarLocal('manha');
    else if (fase === 'fim') tocarLocal(tipoFim === 'vitoria' ? 'vitoria' : 'derrota');
    faseSom = fase;
  }
  if (estado === 'pausa') return;
  const a = som.canais.ambiente, t = som.ctx.currentTime;
  if (fase === 'noite' && Math.random() < dt * 1.6) SONS.grilo(t + .01, a);
  if (fase === 'dia' && Math.random() < dt * .22) SONS.passaro(t + .01, a);
  if (!ventoSom) {
    const n = som.ctx.createBufferSource(), f = som.ctx.createBiquadFilter(), g = som.ctx.createGain();
    n.buffer = ruido(); n.loop = true; f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = .7; g.gain.value = 0;
    n.connect(f); f.connect(g); g.connect(a); n.start();
    ventoSom = { g, f };
  }
  ventoSom.g.gain.setTargetAtTime(ventoVis * .45, t, .2);
  ventoSom.f.frequency.setTargetAtTime(380 + ventoVis * 260 + Math.sin(tempo * 1.7) * 60, t, .3);
  if ((fase === 'dia' || fase === 'noite') && p.trabalhando && !p.caido) {
    tCavar -= dt;
    if (tCavar <= 0) { tocarLocal('cavar', p.x); tCavar = .32; }
  } else tCavar = 0;
}

// Som de exemplo ao soltar cada barra das configurações (a música já está tocando, então ela não precisa)
function somDeTeste(canal) {
  iniciarSom();
  if (!som.ctx) return;
  if (canal === 'ambiente') { SONS.grilo(som.ctx.currentTime + .02, som.canais.ambiente); SONS.passaro(som.ctx.currentTime + .3, som.canais.ambiente); }
  else if (canal !== 'musica') tocarLocal('moeda');
}

// Cria (ou apaga) áreas até ficar com n. Cada área tem 12 lotes, e a cova i é sempre a mesma em todas as máquinas
function ajustarAreas(n) {
  while (AREAS.length > n) { AREAS.pop(); covas.length -= 12; }
  while (AREAS.length < n) {
    const ai = AREAS.length, a = { x: AREA.x0 + ai * AREA.passo, y: AREA.y, w: AREA.w, h: AREA.h };
    AREAS.push(a);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) covas.push({
      area: ai, x: a.x + 30 + c * 58, y: a.y + 80 + r * 150, w: 38, h: 64,
      prof: 0, corpo: null, fechada: false, fechar: 0, enfeite: null,
      pago: false, gorjeta: false, levantou: false, levantarEm: null,
    });
  }
  while (dono.length < n) dono.push(false);
  dono.length = n;
  mundoW = Math.max(W, AREAS[n - 1].x + AREA.w + 14);
}
const areasVisiveis = () => dono.lastIndexOf(true) + 1 + CFG.terrenosAVenda;

function novoJogo() {

  evento = null; eventoHoje = null; tChefe = null; moedas = []; perigos = []; soltas = []; camX = 0;
  AREAS = []; covas = []; dono = [true];

  stats = { ganho: 0, roubado: 0, recuperado: 0 };

}
const metaPara = n => Math.round(CFG.meta * (0.5 + 0.5 * n));

function chegar(especie) {
  const i = fila.indexOf(null);
  if (i < 0) return false;
  especie = especie || (Math.random() < CFG.chanceOgro ? 'ogro' : 'humano');
  const usados = new Set([...fila, ...covas.map(c => c.corpo)].filter(Boolean).map(c => c.nome));

  return true;
}

function comecarDia() {

function comecarNoite() {
  estado = 'noite'; relogio = duracaoNoite(); tNoite = 0; tLimpa = 0; stats.roubado = 0; stats.recuperado = 0;
  const n = nLadroes(), passo = Math.min(8, 42 / n) / Math.max(1, jogadores.length * .75);
  agenda = Array.from({ length: n }, (_, i) => 2 + i * passo + rnd(0, 2)).sort((a, b) => a - b);
  tChefe = ultimaNoite() ? CFG.chefe.chegaEm : null;
  covas.forEach(c => { if (malResolvida(c)) c.levantarEm = rnd(3, 10); });

  aviso(n === 1 ? 'Anoiteceu. Um ladrão vem aí.' : `Anoiteceu. ${n} ladrões vêm aí.`);

function amanhecer() {
  inimigos.forEach(e => { if (e.tipo === 'zumbi') devolver(e); });

  covas.forEach(c => { c.levantarEm = null; });
  jogadores.forEach(q => { q.vida = CFG.vidaMax; q.inv = 0; q.caido = false; });
  soltar();
  if (dia >= CFG.dias) { fim(dinheiro >= meta ? 'vitoria' : 'divida'); return; }
  dia++;
  estado = 'amanhecer';
  renderPainel();
}

function fim(tipo) {

function comprar(item) {
  if (item === 'ferramenta') {
    const f = CFG.ferramentas[nivelFerr + 1];
    if (f && dinheiro >= f.preco) { dinheiro -= f.preco; nivelFerr++; tocar('compra'); }
  } else if (item === 'bota') {
    const b = CFG.botas[nivelBota + 1];
    if (b && dinheiro >= b.preco) { dinheiro -= b.preco; nivelBota++; tocar('compra'); }
  } else if (item === 'lampiao' && dinheiro >= CFG.precoLampiao) { dinheiro -= CFG.precoLampiao; estoque++; tocar('compra'); }
  if (estado === 'loja') mostrarLoja();
}

let avisoTimer = 0;

}
// Mostra para um jogador (q) ou para todos; o anfitrião repassa aos convidados
function aviso(txt, q) {
  if (!q || q === p) avisoLocal(txt);
  if (modo === 'anfitriao' && q !== p) eventos.push({ a: txt, para: q ? q.id : undefined });
}
function avisoOutros(txt, q) {
  if (q !== p) avisoLocal(txt);
  if (modo === 'anfitriao') eventos.push({ a: txt, exceto: q.id });
}
function flutua(x, y, txt, cor, q) {
  const f = { x: Math.max(70, Math.min(mundoW - 70, x)), y: Math.max(56, Math.min(H - 20, y)), txt, cor, t: 0 };
  if (!q || q === p) flutuantes.push(f);
  if (modo === 'anfitriao' && q !== p) eventos.push({ f: [Math.round(f.x), Math.round(f.y), txt, cor], para: q ? q.id : undefined });
}
function tremer(t, q) {
  if ((!q || q === p) && config.tremor) tremor = Math.max(tremor, t);
  if (modo === 'anfitriao' && q !== p) eventos.push({ tr: t, para: q ? q.id : undefined });
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const jogando = estado === 'dia' || estado === 'noite';
  const foco = document.activeElement;
  // Esc volta uma tela: fecha as configurações ou volta ao início
  if (k === 'escape' && !e.repeat && (subtela || (estado === 'titulo' && telaInicio !== 'inicio'))) {
    e.preventDefault();
    if (subtela) fecharConfig(); else { telaInicio = 'inicio'; renderPainel(); }
    return;
  }
  if (foco && foco.tagName === 'INPUT') {
    if (k === 'enter' && !e.repeat) {
      const b = foco.id === 'codigo' ? $('#painel [data-acao=entrar]') : $('#painel [data-principal]');
      if (b) { e.preventDefault(); b.click(); }
    }
    return;
  }
  if (jogando && [' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if ((k === 'p' || k === 'escape') && !e.repeat) {
    if (jogando) pausar(); else if (estado === 'pausa') despausar();
    return;
  }
  if (!jogando) {
    // setas para cima e para baixo andam entre os botões da tela
    if (k === 'arrowdown' || k === 'arrowup') {
      const bs = [...document.querySelectorAll('#painel:not([hidden]) button:not(:disabled)')];
      if (bs.length) {
        e.preventDefault();
        const i = bs.indexOf(foco);
        bs[i < 0 ? 0 : (i + (k === 'arrowdown' ? 1 : bs.length - 1)) % bs.length].focus();
      }
      return;
    }
    if (k === 'enter' && !e.repeat && !(foco && foco.closest && foco.closest('#painel button'))) {
      const b = $('#painel [data-principal]');
      if (b && performance.now() - painelEm > 300) { e.preventDefault(); b.click(); }
    }
    return;
  }
  teclas.add(k);
  if (e.repeat) return;
  if (k === ' ' || k === 'e' || k === 'j') apertar();
  if (k === 'q' || k === 'l') pedirLampiao();
});
addEventListener('keyup', e => teclas.delete(e.key.toLowerCase()));
addEventListener('blur', soltar);

// ===== Ações dos coveiros =====
function distRet(x, y, c) {
  const dx = Math.max(Math.abs(x - c.x) - c.w / 2, 0), dy = Math.max(Math.abs(y - c.y) - c.h / 2, 0);
  return Math.hypot(dx, dy);
}

function alvoAtual(q) {
  let melhor = null, md = Infinity;
  SLOTS.forEach((s, i) => { const d = Math.hypot(q.x - s.x, q.y - s.y); if (d < 44 && d < md) { md = d; melhor = { tipo: 'slot', i }; } });
  ESTANDES.forEach(s => { const d = Math.hypot(q.x - s.x, q.y - s.y); if (d < 42 && d < md) { md = d; melhor = { tipo: 'estande', item: s.item }; } });
  AREAS.forEach((ar, i) => {
    if (dono[i]) return;
    const d = Math.hypot(q.x - (ar.x + ar.w / 2), q.y - (ar.y + ar.h / 2));
    if (d < 70 && d < md) { md = d; melhor = { tipo: 'placa', area: i }; }
  });
  covas.forEach(c => {
    if (!dono[c.area]) return;
    const d = distRet(q.x, q.y, c);
    if (d < 20 && d < md) { md = d; melhor = { tipo: 'cova', cova: c }; }
  });
  return melhor;
}

function inimigoPerto(q, r) {
  let m = null, md = Infinity;
  for (const e of inimigos) {
    if (e.remover) continue;
    const d = Math.hypot(e.x - q.x, e.y - q.y) - e.r;
    if (d < r && d < md) { md = d; m = e; }
  }
  return m;
}

function acaoPress(q) {
  if ((estado !== 'dia' && estado !== 'noite') || q.caido) return;
  const inimigo = inimigoPerto(q, 40);
  if (inimigo) { if (q.cdAtaque <= 0) atacar(q, inimigo); return; }
  const a = alvoAtual(q);
  if (!a) return;
  const leva = q.carrega;

  if (a.tipo === 'slot') {
    const c = fila[a.i];
    if (c && !leva) {
      q.carrega = { tipo: 'corpo', corpo: c }; fila[a.i] = null; tocar('pop', q.x);
      aviso(`${c.nome} quer ${ITEM[c.pedido]}. ${c.especie === 'ogro' ? 'E precisa de cova grande.' : 'Cova pequena serve.'}`, q);
    } else if (!c && leva && leva.tipo === 'corpo') {
      fila[a.i] = leva.corpo; q.carrega = null; tocar('pop', q.x);
    } else if (c && leva) {
      flutua(q.x, q.y - 34, 'Mãos ocupadas', COR.osso, q);
    }
    return;
  }

  if (a.tipo === 'estande') {
    if (leva && leva.tipo === 'corpo') { flutua(q.x, q.y - 34, 'Mãos ocupadas', COR.osso, q); return; }
    if (leva && leva.item === a.item) { q.carrega = null; return; }
    q.carrega = { tipo: 'item', item: a.item }; tocar('pop', q.x);
    return;
  }

  if (a.tipo === 'placa') {
    const preco = CFG.precoTerreno(a.area), ar = AREAS[a.area];
    if (dinheiro >= preco) {
      dinheiro -= preco; dono[a.area] = true; tocar('compra', q.x);
      ajustarAreas(areasVisiveis());
      flutua(ar.x + ar.w / 2, ar.y + ar.h / 2 - 40, `-$${preco}`, COR.ambar);
      aviso(`${modo === 'solo' ? 'Terreno comprado' : q.nome + ' comprou o terreno'}. Mais 12 covas de espaço.`);
    } else flutua(q.x, q.y - 34, `Faltam $${preco - dinheiro}`, COR.osso, q);
    return;
  }

  const c = a.cova;
  if (c.levantou) return;
  if (leva && leva.tipo === 'corpo' && !c.corpo) {
    const req = CFG.profundidade[leva.corpo.especie];
    if (c.prof >= req) {
      c.corpo = leva.corpo; q.carrega = null; c.fechada = false; c.fechar = 0; tocar('baque', c.x);
      flutua(c.x, c.y - 44, 'Na cova', COR.osso);
    } else {
      flutua(c.x, c.y - 44, c.prof < 1 ? 'Cava primeiro' : 'Pequena demais', COR.osso, q);
    }
    return;
  }
  if (leva && leva.tipo === 'item' && c.corpo && c.fechada && c.enfeite !== c.corpo.pedido) {
    if (leva.item === c.corpo.pedido) {
      c.enfeite = leva.item; q.carrega = null; tocar('pop', c.x);
      if (!c.gorjeta) { c.gorjeta = true; ganhar(CFG.gorjeta, c.x, c.y - 48); }
      else flutua(c.x, c.y - 48, 'Enfeitada', COR.osso);
    } else {
      flutua(c.x, c.y - 48, `Queria ${ITEM[c.corpo.pedido]}`, COR.osso, q);
    }
  }
}

function segurar(q, dt, segura) {
  q.trabalhando = false;
  if (!segura || q.caido) return;
  const inimigo = inimigoPerto(q, 40);
  if (inimigo) { if (q.cdAtaque <= 0) atacar(q, inimigo); return; }
  const a = alvoAtual(q);
  if (!a || a.tipo !== 'cova') return;
  const c = a.cova, f = ferramenta();
  if (c.levantou) return;
  if (c.corpo && !c.fechada) {
    c.fechar = Math.min(1, c.fechar + CFG.fecharPorSeg * f.cavar * dt);
    q.trabalhando = true;
    if (c.fechar >= 1) {
      c.fechada = true;
      if (!c.pago) { c.pago = true; ganhar(CFG.pagamento[c.corpo.especie], c.x, c.y - 48); }
      else flutua(c.x, c.y - 48, 'Fechada', COR.osso);
    }
    return;
  }
  if (!c.corpo && c.prof < 2) {
    const leva = q.carrega;
    if (leva && leva.tipo === 'corpo' && c.prof >= CFG.profundidade[leva.corpo.especie]) return;
    const antes = c.prof;
    c.prof = Math.min(2, c.prof + CFG.cavarPorSeg * f.cavar * dt);
    q.trabalhando = true;
    if (antes < 1 && c.prof >= 1) flutua(c.x, c.y - 48, 'Cova pequena', COR.osso);
    if (antes < 2 && c.prof >= 2) flutua(c.x, c.y - 48, 'Cova grande', COR.osso);
  }
}

function ganhar(v, x, y) {
  dinheiro += v; stats.ganho += v; tocar('moeda', x);
  flutua(x, y, `+$${v}`, COR.ambar);
}

function colocarLampiao(q) {
  if (estado !== 'dia' && estado !== 'noite') return;
  if (estoque <= 0) { aviso('Acabou o lampião. Dá pra comprar mais no anoitecer.', q); return; }
  if (lampioes.some(l => Math.hypot(l.x - q.x, l.y - q.y) < 30)) { flutua(q.x, q.y - 34, 'Já tem um aqui', COR.osso, q); return; }
  lampioes.push({ x: Math.round(q.x), y: Math.round(q.y + 4) }); estoque--; tocar('pop', q.x);
  flutua(q.x, q.y - 34, 'Lampião aceso', COR.ambar);
}

function atacar(q, e) {
  const a = Math.atan2(e.y - q.y, e.x - q.x), peso = e.peso == null ? 1 : e.peso;
  e.vida -= ferramenta().dano * (1 - (e.defesa || 0)); e.flash = .12;
  q.cdAtaque = .35; q.golpe = .16; q.dir = a; tocar('golpe', e.x);
  e.x += Math.cos(a) * 22 * peso; e.y += Math.sin(a) * 22 * peso;
  if (e.tipo === 'ladrao' && e.estado === 'roubando') e.prog = Math.max(0, e.prog - .35);
  if (e.vida <= 0) derrotar(e);
}

function derrotar(e) {
  e.remover = true;
  if (e.tipo === 'zumbi') { devolver(e); flutua(e.x, e.y - 30, 'De volta pra cova', COR.osso); return; }
  const trocado = e.tipo === 'chefe' ? CFG.moedas.chefe : CFG.moedas[e.especie === 'brutamontes' ? 'brutamontes' : 'ladrao'](dia);
  soltarMoedas(e.x, e.y, trocado + e.saque, e.saque);
  if (e.tipo === 'chefe') {
    perigos = perigos.filter(h => h.tipo === 'estrepe' && h.t >= CFG.chefe.estrepes.voo);
    efeito('explosao', e.x, e.y); tremer(.4); tocar('explosao', e.x);
    aviso('O chefão caiu! Corre pegar as moedas.');
  } else flutua(e.x, e.y - 30, e.saque > 0 ? 'Largou o saque!' : 'Fugiu!', COR.osso);
}

// ===== Moedas no chão =====
// total em moedas espalhadas; rec é a parte que era dinheiro roubado e volta
function soltarMoedas(x, y, total, rec) {
  const n = Math.min(12, Math.max(1, Math.ceil(total / CFG.moedas.valor)));
  for (let i = 0; i < n; i++) {
    const v = Math.floor(total / n) + (i < total % n ? 1 : 0);
    if (v <= 0) continue;
    const r = Math.min(v, rec), a = rnd(0, TAU), d = rnd(12, 34 + n * 3);
    rec -= r;
    moedas.push({
      id: ++idMoeda, v, rec: r, t: 0, ox: x, oy: y,
      x: Math.max(20, Math.min(mundoW - 20, x + Math.cos(a) * d)), y: Math.max(52, Math.min(H - 16, y + Math.sin(a) * d)),
    });
  }
}
const MOEDA_VOO = .4;
function atualizarMoedas(dt) {
  moedas.forEach(m => {
    m.t += dt;
    if (m.t < MOEDA_VOO) return;
    const q = jogadores.find(o => !o.caido && Math.hypot(o.x - m.x, o.y - m.y) < CFG.moedas.pegar);
    if (!q) return;
    m.pega = true;
    dinheiro += m.v; stats.recuperado += m.rec; stats.ganho += m.v - m.rec; tocar('moeda', m.x);
    flutua(m.x, m.y - 20, `+$${m.v}`, COR.ambar);
  });
  moedas = moedas.filter(m => !m.pega);
}

function ferir(q, d, fonte) {
  if (q.inv > 0 || q.caido || estado !== 'noite') return;
  q.vida -= d; q.inv = .8; tremer(.25, q); tocar('dor', q.x);
  const a = Math.atan2(q.y - fonte.y, q.x - fonte.x);
  q.x += Math.cos(a) * 14; q.y += Math.sin(a) * 14; prender(q);
  flutua(q.x, q.y - 34, `-${d} de vida`, COR.sangue);
  if (q.vida > 0) return;
  q.vida = 0; q.caido = true; q.trabalhando = false;
  if (q.carrega && q.carrega.tipo === 'corpo') { const i = fila.indexOf(null); if (i >= 0) { fila[i] = q.carrega.corpo; q.carrega = null; } }
  if (jogadores.every(o => o.caido)) { fim('morte'); return; }
  aviso('Você caiu. Volta quando amanhecer.', q);
  avisoOutros(`${q.nome} caiu. Volta quando amanhecer.`, q);
}

// ===== Inimigos =====
function novoLadrao() {
  const especie = Math.random() < CFG.chanceBrutamontes(dia) ? 'brutamontes' : 'comum';
  const t = CFG.ladrao[especie], vida = t.vida(dia);
  const lado = escolha(['direita', 'baixo', 'cima']);
  const pos = lado === 'direita' ? { x: mundoW + 16, y: rnd(80, H - 40) }
    : lado === 'baixo' ? { x: rnd(260, mundoW - 30), y: H + 16 }
    : { x: rnd(260, mundoW - 30), y: 18 };
  inimigos.push({
    id: ++idInimigo, tipo: 'ladrao', especie, x: pos.x, y: pos.y, r: t.r, vida, vidaMax: vida, vel: t.vel, dano: t.dano, peso: t.peso,
    defesa: CFG.defesa(dia), cura: CFG.cura(dia), estado: 'indo', alvo: null, prog: 0, saque: 0, cd: .6, flash: 0, dir: Math.PI,
  });
  const bruto = especie === 'brutamontes';
  tocar('ladrao', pos.x);
  aviso(bruto ? 'Um brutamontes pulou o muro!' : 'Um ladrão pulou o muro!');
  flutua(pos.x, pos.y, bruto ? 'Brutamontes!' : 'Ladrão!', COR.sangue);
}

function levantar(c) {
  const z = CFG.zumbi[c.corpo.especie];
  c.levantou = true; c.fechada = false; c.fechar = 0; c.enfeite = null;
  inimigos.push({ id: ++idInimigo, tipo: 'zumbi', especie: c.corpo.especie, x: c.x, y: c.y, r: z.r, vida: z.vida, vidaMax: z.vida, vel: z.vel, dano: z.dano, defesa: CFG.defesa(dia), cura: CFG.cura(dia), cova: c, cd: .8, flash: 0, dir: 0 });
  flutua(c.x, c.y - 44, `${c.corpo.nome} levantou!`, COR.sangue); tocar('gemido', c.x);
  tremer(.2);
}
function devolver(z) { z.cova.levantou = false; }

const alvoValido = c => c && c.corpo && c.fechada && !c.levantou && !iluminada(c);
function escolherAlvo(e) {
  const livres = covas.filter(c => alvoValido(c) && !inimigos.some(o => o !== e && o.alvo === c));
  const ricas = livres.filter(c => c.enfeite);
  const pool = ricas.length ? ricas : livres;
  if (!pool.length) return null;
  return pool.reduce((m, c) => dist(c, e) < dist(m, e) ? c : m);
}
function coveiroMaisPerto(e) {
  let m = null, md = Infinity;
  jogadores.forEach(q => { if (q.caido) return; const d = dist(q, e); if (d < md) { md = d; m = q; } });
  return m;
}

function andarAte(e, tx, ty, passo) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= passo || d < 1) { e.x = tx; e.y = ty; return true; }
  e.x += dx / d * passo; e.y += dy / d * passo; e.dir = Math.atan2(dy, dx);
  return false;
}

function saida(e) {
  const op = [{ x: mundoW + 30, y: e.y }, { x: e.x, y: H + 30 }, { x: e.x, y: -30 }];
  return op.reduce((m, o) => dist(o, e) < dist(m, e) ? o : m);
}

function roubar(e) {
  const c = e.alvo, v = Math.min(dinheiro, Math.round(CFG.roubo(dia) * (CFG.ladrao[e.especie] || CFG.ladrao.comum).roubo));
  dinheiro -= v; e.saque = v; stats.roubado += v; tocar('roubo', c.x);
  c.fechada = false; c.fechar = 0; c.enfeite = null;
  flutua(c.x, c.y - 44, v > 0 ? `-$${v}` : 'Revirou a cova', COR.sangue);
  aviso(v > 0 ? `Levaram $${v}! Pega o ladrão antes que ele fuja.` : 'Um ladrão revirou uma cova.');
  e.estado = 'fugindo'; e.alvo = null;
}

function atualizarInimigos(dt) {
  for (const e of inimigos) {
    if (e.remover) continue;
    e.cd = Math.max(0, e.cd - dt); e.flash = Math.max(0, e.flash - dt);
    if (e.cura && e.vida < e.vidaMax) e.vida = Math.min(e.vidaMax, e.vida + e.cura * dt);
    if (e.tipo === 'chefe') { atualizarChefe(e, dt); continue; }
    if (e.tipo === 'zumbi') {
      const q = coveiroMaisPerto(e);
      if (!q) continue;
      andarAte(e, q.x, q.y, e.vel * dt);
      if (dist(e, q) < e.r + q.r + 2 && e.cd <= 0) { e.cd = 1; ferir(q, e.dano, e); }
      continue;
    }
    if (e.estado === 'indo') {
      if (!alvoValido(e.alvo)) e.alvo = escolherAlvo(e);
      if (!e.alvo) { e.estado = 'fugindo'; flutua(e.x, e.y - 28, 'Nada pra levar', COR.osso); }
      else if (andarAte(e, e.alvo.x + 26, e.alvo.y, e.vel * dt)) { e.estado = 'roubando'; e.prog = 0; }
    } else if (e.estado === 'roubando') {
      if (!alvoValido(e.alvo)) { e.estado = 'indo'; e.alvo = null; }
      else { e.dir = Math.PI; e.prog += dt / CFG.tempoRoubo; if (e.prog >= 1) roubar(e); }
    } else {
      const s = saida(e);
      if (andarAte(e, s.x, s.y, e.vel * 1.3 * dt)) e.remover = true;
    }
    if (e.estado !== 'fugindo' && e.cd <= 0) {
      const q = jogadores.find(o => !o.caido && dist(o, e) < e.r + o.r + 6);
      if (q) { e.cd = 1.4; ferir(q, e.dano || 1, e); }
    }
  }
  for (let i = 0; i < inimigos.length; i++) for (let j = i + 1; j < inimigos.length; j++) {
    const a = inimigos[i], b = inimigos[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, m = a.r + b.r;
    if (d >= m) continue;
    // O chefe não é empurrado: quem sai da frente é o outro
    const ka = a.tipo === 'chefe' ? 0 : b.tipo === 'chefe' ? 1 : .5, k = m - d;
    a.x -= dx / d * k * ka; a.y -= dy / d * k * ka; b.x += dx / d * k * (1 - ka); b.y += dy / d * k * (1 - ka);
  }
  inimigos = inimigos.filter(e => !e.remover);
}

// ===== Chefão: anda atrás do coveiro mais perto e alterna ataques que avisam antes =====
function novoChefe() {
  const cf = CFG.chefe, q = coveiroMaisPerto({ x: mundoW / 2, y: H / 2 }) || p;
  const vida = Math.round(cf.vida * (0.6 + 0.4 * jogadores.length));
  const x = Math.max(260, Math.min(mundoW - 60, q.x + rnd(-140, 140)));
  inimigos.push({
    id: ++idInimigo, tipo: 'chefe', especie: '', x, y: 6, r: cf.r, vida, vidaMax: vida, vel: cf.vel, peso: 0,
    defesa: CFG.defesa(dia), cura: CFG.cura(dia) / 2, estado: 'andando', prog: 0, saque: 0, cd: 2.5, cdGolpe: 0, flash: 0, dir: Math.PI / 2, ultimo: '',
  });
  aviso('O chefe dos ladrões pulou o muro!'); tremer(.5); tocar('chefe', x);
  flutua(x, 70, 'Chefão!', COR.sangue);
}

function atualizarChefe(e, dt) {
  const cf = CFG.chefe, q = coveiroMaisPerto(e);
  e.cdGolpe = Math.max(0, e.cdGolpe - dt);
  if (!q) return;
  const mirar = () => { e.dir = Math.atan2(q.y - e.y, q.x - e.x); };
  if (e.estado === 'andando') {
    const d = dist(e, q);
    if (d > e.r + q.r + 8) andarAte(e, q.x, q.y, e.vel * dt); else mirar();
    if (d < e.r + q.r + cf.golpe.alcance && e.cdGolpe <= 0) { e.estado = 'golpe'; e.prog = 0; mirar(); tocar('alerta', e.x); }
    else if (e.cd <= 0) comecarAtaque(e, q);
  } else if (e.estado === 'golpe') {
    e.prog += dt / cf.golpe.preparo;
    if (e.prog < 1) return;
    e.estado = 'andando'; e.cdGolpe = 1.3;
    jogadores.forEach(o => {
      if (o.caido || o.inv > 0 || dist(o, e) > e.r + o.r + cf.golpe.alcance) return;
      ferir(o, cf.golpe.dano, e);
      const v = Math.min(dinheiro, cf.roubo);
      if (v > 0) { dinheiro -= v; e.saque += v; stats.roubado += v; flutua(o.x, o.y - 52, `-$${v}`, COR.sangue); }
    });
    tremer(.12);
  } else if (e.estado === 'mirando') {
    e.prog += dt / cf.investida.mira;
    if (e.prog >= 1) { e.estado = 'investindo'; e.resta = cf.investida.alcance; e.acertou = []; }
  } else if (e.estado === 'investindo') {
    const passo = Math.min(e.resta, cf.investida.vel * dt);
    e.x += Math.cos(e.dir) * passo; e.y += Math.sin(e.dir) * passo; e.resta -= passo;
    const bateu = e.x < e.r || e.x > mundoW - e.r || e.y < 40 + e.r || e.y > H - e.r;
    e.x = Math.max(e.r, Math.min(mundoW - e.r, e.x)); e.y = Math.max(40 + e.r, Math.min(H - e.r, e.y));
    jogadores.forEach(o => {
      if (o.caido || e.acertou.includes(o.id) || dist(o, e) > e.r + o.r) return;
      e.acertou.push(o.id); ferir(o, cf.investida.dano, e);
    });
    if (e.resta <= 0 || bateu) { e.estado = 'tonto'; e.prog = 0; if (bateu) tremer(.2); }
  } else if (e.estado === 'tonto') {
    e.prog += dt / cf.investida.tonto;
    if (e.prog >= 1) { e.estado = 'andando'; e.prog = 0; }
  } else if (e.estado === 'arremessando') {
    e.prog += dt / .45;
    if (e.prog < 1) return;
    e.estado = 'andando'; e.prog = 0;
    arremessar(e, e.jogar, q);
  }
}

function comecarAtaque(e, q) {
  const cf = CFG.chefe, a = escolha(['bombas', 'investida', 'estrepes'].filter(x => x !== e.ultimo));
  e.ultimo = a; e.prog = 0;
  e.cd = rnd(cf.intervalo[0], cf.intervalo[1]);
  if (a === 'investida') { tocar('alerta', e.x); e.estado = 'mirando'; e.dir = Math.atan2(q.y - e.y, q.x - e.x); e.cd += cf.investida.mira + cf.investida.tonto; }
  else { e.estado = 'arremessando'; e.jogar = a; }
}

function arremessar(e, a, q) {
  const cf = CFG.chefe, ox = e.x, oy = e.y - e.r;
  tocar('arremesso', e.x);
  if (a === 'bombas') {
    const n = cf.bombas.n + Math.max(0, jogadores.length - 1);
    for (let i = 0; i < n; i++) {
      const alvo = i === 0 ? q : escolha(jogadores.filter(o => !o.caido)) || q;
      const ang = rnd(0, TAU), d = i === 0 ? 0 : rnd(50, 95);
      perigos.push({ tipo: 'bomba', ox, oy, x: prenderX(alvo.x + Math.cos(ang) * d), y: prenderY(alvo.y + Math.sin(ang) * d), t: -i * .12, dur: cf.bombas.voo });
    }
  } else {
    for (let i = 0; i < cf.estrepes.n; i++) {
      const ang = rnd(0, TAU), d = rnd(30, 150);
      perigos.push({ tipo: 'estrepe', ox, oy, x: prenderX(q.x + Math.cos(ang) * d), y: prenderY(q.y + Math.sin(ang) * d), t: -i * .05, dur: cf.estrepes.voo + cf.estrepes.dura });
    }
  }
}
const prenderX = x => Math.max(20, Math.min(mundoW - 20, x));
const prenderY = y => Math.max(56, Math.min(H - 16, y));

function atualizarPerigos(dt) {
  const cf = CFG.chefe;
  perigos.forEach(h => {
    h.t += dt;
    if (h.tipo === 'bomba') {
      if (h.t < h.dur) return;
      h.fim = true;
      efeito('explosao', h.x, h.y); tremer(.15); tocar('explosao', h.x);
      jogadores.forEach(o => { if (!o.caido && Math.hypot(o.x - h.x, o.y - h.y) < cf.bombas.raio + o.r * .5) ferir(o, cf.bombas.dano, h); });
    } else {
      if (h.t >= h.dur) { h.fim = true; return; }
      if (h.t < cf.estrepes.voo) return;
      const o = jogadores.find(q => !q.caido && q.inv <= 0 && Math.hypot(q.x - h.x, q.y - h.y) < q.r + 6);
      if (o) { h.fim = true; ferir(o, cf.estrepes.dano, h); }
    }
  });
  perigos = perigos.filter(h => !h.fim);
}

// ===== Eventos do dia =====
// Cada evento tem um aviso, um começo e um passo que devolve true quando acaba.
// Para criar outro, some uma entrada aqui e os números dele em CFG.eventos.
const EVENTOS = {
  vento: {
    aviso: 'Tá começando a ventar forte...',
    comecar(ev) { ev.frente = -80; ev.feitas = new Set(); aviso('Ventania! Segura o chapéu.'); },
    // Uma frente de vento atravessa o cemitério da esquerda para a direita: leva as rosas e apaga as velas por onde passa
    passo(ev, dt) {
      const cf = CFG.eventos.vento;
      ev.frente += cf.velocidade * dt;
      covas.forEach((c, i) => {
        if (c.x > ev.frente || ev.feitas.has(i)) return;
        ev.feitas.add(i);
        if (!dono[c.area] || !c.corpo || Math.random() > cf.pegaCova) return;
        if (c.enfeite === 'rosa') { c.enfeite = null; efeito('rosa', c.x, c.y + c.h / 2 - 14); }
        else if (c.enfeite === 'vela') { c.enfeite = 'apagada'; efeito('fumaca', c.x, c.y + c.h / 2 - 22); }
      });
      return ev.frente > mundoW + 200;
    },
  },
};

function sortearEvento() {
  evento = null;
  const tipos = Object.keys(EVENTOS).filter(k => dia >= CFG.eventos[k].desdeDia && Math.random() < CFG.eventos[k].chance);
  eventoHoje = tipos.length ? { tipo: escolha(tipos), em: rnd(.3, .65) * CFG.duracaoDia } : null;
}

function atualizarEvento(dt) {
  if (eventoHoje && CFG.duracaoDia - relogio >= eventoHoje.em) {
    evento = { tipo: eventoHoje.tipo, etapa: 'aviso', t: 0, frente: -80 }; eventoHoje = null;
    aviso(EVENTOS[evento.tipo].aviso);
  }
  if (!evento) return;
  evento.t += dt;
  if (evento.etapa === 'aviso') {
    if (evento.t >= CFG.eventos[evento.tipo].aviso) { evento.etapa = 'ativo'; evento.t = 0; EVENTOS[evento.tipo].comecar(evento); }
  } else if (EVENTOS[evento.tipo].passo(evento, dt)) evento = null;
}

// ===== Efeitos (só visuais; o anfitrião repassa aos convidados) =====
function efeito(tipo, x, y) {
  efeitoLocal(tipo, x, y);
  if (modo === 'anfitriao') eventos.push({ fx: [tipo, Math.round(x), Math.round(y)] });
}
function efeitoLocal(tipo, x, y) {
  const s = (o) => soltas.push(Object.assign({ x, y, vx: 0, vy: 0, rot: 0, vr: 0, t: 0, vida: 1 }, o));
  if (tipo === 'rosa') {
    s({ tipo: 'rosa', vx: rnd(240, 340), vy: rnd(-90, -40), vr: rnd(5, 9), vida: 2.4 });
    for (let i = 0; i < 5; i++) s({ tipo: 'petala', x: x + rnd(-5, 5), y: y + rnd(-5, 5), vx: rnd(150, 330), vy: rnd(-70, 30), rot: rnd(0, TAU), vr: rnd(-9, 9), vida: rnd(1.3, 2.2) });
  } else if (tipo === 'fumaca') {
    for (let i = 0; i < 3; i++) s({ tipo: 'fumaca', x: x + rnd(-2, 2), y: y - i * 4, vx: rnd(50, 90), vy: rnd(-32, -18), t: -i * .08, vida: 1.3 });
  } else if (tipo === 'explosao') {
    s({ tipo: 'clarao', vida: .35 });
    for (let i = 0; i < 6; i++) { const a = rnd(0, TAU), v = rnd(30, 70); s({ tipo: 'fumaca', x: x + Math.cos(a) * 10, y: y + Math.sin(a) * 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, t: -rnd(0, .1), vida: rnd(.8, 1.2) }); }
  }
}

function atualizarSoltas(dt) {
  const alvo = evento && evento.tipo === 'vento' ? (evento.etapa === 'ativo' ? 1 : .4) : 0;
  ventoVis += (alvo - ventoVis) * Math.min(1, dt * 1.5);
  soltas.forEach(s => {
    s.t += dt;
    if (s.t < 0) return;
    s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    if (s.tipo === 'rosa' || s.tipo === 'petala') s.y += Math.sin(s.t * 7 + s.rot) * 14 * dt;
  });
  soltas = soltas.filter(s => s.t < s.vida);
  // Rajadas e folhas ficam na tela, não no mundo
  const taxa = ventoVis * (reduzMov ? 8 : 36) * dt;
  for (let k = taxa; k > 0; k--) {
    if (Math.random() > k) break;
    rajadas.push({ x: rnd(-120, W), y: rnd(44, H - 10), len: rnd(40, 130), v: rnd(700, 1000), t: 0, a: rnd(.18, .38), fase: rnd(0, TAU) });
    if (Math.random() < .35) folhas.push({ x: -10, y: rnd(50, H - 10), vx: rnd(380, 600), vy: rnd(-40, 40), rot: rnd(0, TAU), vr: rnd(-10, 10), cor: escolha(['#b07a35', '#8a6a2a', '#c9a24a', '#7d5a2c']) });
  }
  if (evento && evento.tipo === 'vento' && evento.etapa === 'ativo' && !reduzMov) {
    const fx = evento.frente - camX;
    if (fx > -60 && fx < W + 60 && Math.random() < dt * 40) rajadas.push({ x: fx + rnd(-40, 20), y: rnd(44, H - 10), len: rnd(90, 180), v: rnd(900, 1100), t: 0, a: rnd(.35, .55), fase: rnd(0, TAU) });
  }
  rajadas.forEach(r => { r.x += r.v * dt; r.t += dt; });
  rajadas = rajadas.filter(r => r.x - r.len < W + 20);
  folhas.forEach(f => { f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(f.rot) * 30 * dt; f.rot += f.vr * dt; });
  folhas = folhas.filter(f => f.x < W + 20);
}

function atualizarCamera(dt) {
  const alvo = Math.max(0, Math.min(mundoW - W, p.x - W / 2));
  camX += (alvo - camX) * Math.min(1, dt * 6);
  if (Math.abs(alvo - camX) < .3) camX = alvo;
}

// ===== Atualização =====
function prender(q) {
  q.x = Math.max(q.r, Math.min(mundoW - q.r, q.x));
  q.y = Math.max(46, Math.min(H - q.r, q.y));
}

function mover(dt) {
  if (p.caido) { p.andando = false; return; }
  let dx = 0, dy = 0;
  if (teclas.has('arrowleft') || teclas.has('a')) dx--;
  if (teclas.has('arrowright') || teclas.has('d')) dx++;
  if (teclas.has('arrowup') || teclas.has('w')) dy--;
  if (teclas.has('arrowdown') || teclas.has('s')) dy++;
  dx += joy.x; dy += joy.y;
  const m = Math.hypot(dx, dy);
  p.andando = m > 0.15;
  if (!p.andando) return;
  if (m > 1) { dx /= m; dy /= m; }
  const pesado = p.carrega && p.carrega.tipo === 'corpo' && p.carrega.corpo.especie === 'ogro';
  const vel = CFG.velocidade * bota().vel * (pesado ? 0.7 : 1);
  p.x += dx * vel * dt; p.y += dy * vel * dt;
  p.dir = Math.atan2(dy, dx);
  prender(p);
}

function atualizar(dt) {
  tempo += dt;
  tremor = Math.max(0, tremor - dt);
  const fase = estado === 'pausa' ? estadoPausado : estado;
  const alvoEscuro = fase === 'noite' ? .8 : fase === 'loja' ? .55 : (fase === 'titulo' || fase === 'sala' || fase === 'conexao') ? .35
    : fase === 'dia' && relogio < 15 ? (1 - relogio / 15) * .4 : fase === 'fim' ? .45 : 0;
  escuro += (alvoEscuro - escuro) * Math.min(1, dt * 2);
  flutuantes.forEach(f => { f.t += dt; f.y -= 22 * dt; });
  flutuantes = flutuantes.filter(f => f.t < 1.4);
  atualizarSoltas(dt);
  atualizarSom(dt);

  if (modo === 'convidado') {
    if (estado === 'dia' || estado === 'noite') {
      relogio = Math.max(0, relogio - dt); mover(dt);
      moedas.forEach(m => { m.t += dt; }); perigos.forEach(h => { h.t += dt; });
    }
    suavizar(dt);
    atualizarCamera(dt);
    enviarEntrada(false);
    return;
  }
  atualizarCamera(dt);
  if (estado !== 'dia' && estado !== 'noite') return;

  relogio -= dt;
  jogadores.forEach(q => { q.inv = Math.max(0, q.inv - dt); q.cdAtaque = Math.max(0, q.cdAtaque - dt); q.golpe = Math.max(0, q.golpe - dt); });
  mover(dt);
  jogadores.forEach(q => segurar(q, dt, q === p ? segurando() : q.segurando));
  atualizarMoedas(dt);

  if (estado === 'dia') {
    tChegada += dt;
    if (tChegada >= CFG.intervaloChegada / (0.5 + 0.5 * jogadores.length)) {
      tChegada = 0;
      if (chegar()) flutua(96, 96, 'Chegou defunto', COR.osso);
    }
    atualizarEvento(dt);
    if (relogio <= 0) anoitecer();
    return;
  }

  tNoite += dt;
  while (agenda.length && agenda[0] <= tNoite) { agenda.shift(); novoLadrao(); }
  if (tChefe != null && tNoite >= tChefe) { tChefe = null; novoChefe(); }
  covas.forEach(c => {
    if (c.levantarEm == null) return;
    c.levantarEm -= dt;
    if (c.levantarEm <= 0) { c.levantarEm = null; if (malResolvida(c)) levantar(c); }
  });
  atualizarInimigos(dt);
  if (estado !== 'noite') return;
  atualizarPerigos(dt);
  if (estado !== 'noite') return;
  const limpa = !agenda.length && tChefe == null && !inimigos.length && !covas.some(c => c.levantarEm != null);
  if (limpa && tLimpa === 0) aviso('Cemitério limpo. Já vai amanhecer.');
  tLimpa = limpa ? tLimpa + dt : 0;
  if (tLimpa >= 1.5 || relogio <= 0) amanhecer();
}

// ===== Rede: partida online com conexão direta entre navegadores (PeerJS) =====
const PREFIXO = 'coveiro-jogo-';
let peer = null, conexaoAnfitriao = null, codigoSala = '', eventos = [], ultimoEnvio = 0, ultimoMundo = 0, assinatura = '';
const conexoes = new Map();

function carregarPeer() {
  if (window.Peer) return Promise.resolve();
  return new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';
    s.onload = ok; s.onerror = falha;
    document.head.appendChild(s);
  });
}
const linkSala = () => location.origin + location.pathname + '?sala=' + codigoSala;
function novoCodigo() {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join('');
}

function erroRede(msg) {
  if (peer) { try { peer.destroy(); } catch (e) { /* já fechado */ } }
  peer = null; conexaoAnfitriao = null; conexoes.clear();
  modo = 'solo'; p.id = 'eu'; jogadores = [p];
  estado = 'conexao';
  mostrarMensagem('Não conectou', msg, 'Voltar');
}

// Sai de qualquer partida e volta para uma das telas de antes do jogo ('inicio' ou 'multi')
function voltarInicio(tela = 'inicio') {
  if (peer) { try { peer.destroy(); } catch (e) { /* já fechado */ } }
  peer = null; conexaoAnfitriao = null; conexoes.clear(); codigoSala = ''; salaUrl = '';
  modo = 'solo'; p.id = 'eu'; jogadores = [p];
  try { if (location.search) history.replaceState(null, '', location.pathname); } catch (e) { /* sem histórico */ }
  estado = 'titulo'; telaInicio = tela; subtela = null; soltar(); novoJogo(); renderPainel();
}

async function criarSala() {
  estado = 'conexao';
  mostrarMensagem('Criando a sala', 'Só um segundo, tá conectando.');
  try { await carregarPeer(); } catch (e) { erroRede('Não deu pra carregar o online. Confere a internet e tenta de novo.'); return; }
  codigoSala = novoCodigo();
  const este = peer = new Peer(PREFIXO + codigoSala);
  este.on('open', () => {
    if (peer !== este) return;
    modo = 'anfitriao'; p.id = 'h'; jogadores = [p];
    estado = 'sala'; renderPainel();
  });
  este.on('connection', aceitar);
  este.on('disconnected', () => { try { if (!este.destroyed) este.reconnect(); } catch (e) { /* tenta de novo depois */ } });
  este.on('error', e => {
    if (peer !== este) return;
    if (e.type === 'unavailable-id') { este.destroy(); peer = null; criarSala(); return; }
    if (modo === 'anfitriao') { if (e.type !== 'peer-unavailable') avisoLocal('A conexão tá instável (' + e.type + ').'); return; }
    erroRede('Não deu pra criar a sala (' + e.type + '). Tenta de novo.');
  });
}

function aceitar(conn) {
  conn.on('open', () => {
    if (jogadores.length >= CFG.maxJogadores) { conn.send({ t: 'cheia' }); setTimeout(() => conn.close(), 400); return; }
    const cor = CORES.find(c => !jogadores.some(q => q.cor === c)) || CORES[1];
    const q = novoJogador(conn.peer, 'Coveiro', cor);
    q.conn = conn; q.x = 184; q.y = 300;
    jogadores.push(q); conexoes.set(conn.peer, q);
    conn.send({ t: 'bem', id: q.id });
    if (estado === 'sala') renderPainel();
  });
  conn.on('data', d => receberDoConvidado(conn.peer, d));
  conn.on('close', () => sair(conn.peer));
  conn.on('error', () => sair(conn.peer));
}

function sair(id) {
  const q = conexoes.get(id);
  if (!q) return;
  conexoes.delete(id);
  jogadores = jogadores.filter(o => o !== q);
  if (q.carrega && q.carrega.tipo === 'corpo') { const i = fila.indexOf(null); if (i >= 0) fila[i] = q.carrega.corpo; }
  aviso(`${q.nome} saiu da partida.`);
  if (estado === 'sala') renderPainel();
  if (estado === 'noite' && jogadores.every(o => o.caido)) fim('morte');
}

function receberDoConvidado(id, d) {
  const q = conexoes.get(id);
  if (!q || !d || d.t !== 'in') return;
  if (typeof d.n === 'string') {
    const nome = limparNome(d.n);
    if (nome !== q.nome) {
      const primeiro = !q.apresentado;
      q.nome = nome; q.apresentado = true;
      if (estado === 'sala') renderPainel(); else if (primeiro) aviso(`${nome} entrou na partida.`);
    }
    q.apresentado = true;
  }
  if (!q.caido && Number.isFinite(d.x) && Number.isFinite(d.y)) {
    q.x = d.x; q.y = d.y; prender(q);
    q.dir = Number.isFinite(d.dir) ? d.dir : 0; q.andando = !!d.an;
  }
  q.segurando = !!d.seg;
  if (Number.isInteger(d.a) && d.a > q.acaoSeq) { const n = Math.min(3, d.a - q.acaoSeq); q.acaoSeq = d.a; for (let k = 0; k < n; k++) acaoPress(q); }
  if (Number.isInteger(d.l) && d.l > q.lampSeq) { q.lampSeq = d.l; colocarLampiao(q); }
  if (Array.isArray(d.c) && Number.isInteger(d.c[0]) && d.c[0] > q.compraSeq) {
    q.compraSeq = d.c[0];
    if (estado === 'loja' && ['ferramenta', 'bota', 'lampiao'].includes(d.c[1])) comprar(d.c[1]);
  }
}

const r2 = v => Math.round(v * 100) / 100;
function fotoMundo() {
  return {
    t: 'mundo', estado: estado === 'pausa' ? estadoPausado : estado, dia, dinheiro, meta, relogio: Math.round(relogio * 10) / 10,
    nivelFerr, nivelBota, dono, estoque, tipoFim, stats, codigo: codigoSala, fila, lampioes,
    evento: evento ? [evento.tipo, evento.etapa, Math.round(evento.frente || 0)] : null,
    moedas: moedas.map(m => [m.id, Math.round(m.x), Math.round(m.y), Math.round(m.ox), Math.round(m.oy), r2(m.t)]),
    perigos: perigos.map(h => [h.tipo, Math.round(h.x), Math.round(h.y), Math.round(h.ox), Math.round(h.oy), r2(h.t), r2(h.dur)]),
    covas: covas.map(c => (c.prof || c.corpo)
      ? [r2(c.prof), c.corpo, c.fechada ? 1 : 0, r2(c.fechar), c.enfeite, c.levantou ? 1 : 0, c.levantarEm != null && c.levantarEm < 2.2 ? 1 : 0, c.pago ? 1 : 0]
      : 0),
    inimigos: inimigos.filter(e => !e.remover).map(e => [e.id, e.tipo, e.especie || '', Math.round(e.x), Math.round(e.y), e.r, r2(e.vida), e.estado || '', r2(e.prog || 0), e.saque || 0, r2(e.dir), e.flash > 0 ? 1 : 0, r2(e.vidaMax || e.vida)]),
    jogadores: jogadores.map(q => [q.id, q.nome, q.cor, Math.round(q.x), Math.round(q.y), r2(q.dir), q.carrega, q.vida, q.caido ? 1 : 0, q.golpe > 0 ? 1 : 0, q.trabalhando ? 1 : 0, q.andando ? 1 : 0, q.inv > 0 ? 1 : 0]),
    ev: eventos,
  };
}

function enviarMundo() {
  if (modo !== 'anfitriao') return;
  if (!conexoes.size) { eventos = []; return; }
  const agora = performance.now();
  if (agora - ultimoMundo < 66) return;
  ultimoMundo = agora;
  const m = fotoMundo();
  eventos = [];
  conexoes.forEach(q => { if (q.conn && q.conn.open) { try { q.conn.send(m); } catch (e) { /* conexão caindo */ } } });
}

async function entrarSala(codigo) {
  codigo = String(codigo).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (codigo.length !== 4) { avisoLocal('O código da sala tem 4 letras.'); return; }
  estado = 'conexao';
  mostrarMensagem('Entrando', `Procurando a sala ${codigo}.`);
  try { await carregarPeer(); } catch (e) { erroRede('Não deu pra carregar o online. Confere a internet e tenta de novo.'); return; }
  const este = peer = new Peer();
  const limite = setTimeout(() => { if (peer === este && modo !== 'convidado') erroRede(`Não achei a sala ${codigo}. Confere o código ou pede um link novo.`); }, 15000);
  este.on('open', () => {
    const conn = este.connect(PREFIXO + codigo, { serialization: 'json', reliable: true });
    conn.on('open', () => { conexaoAnfitriao = conn; codigoSala = codigo; enviarEntrada(true); });
    conn.on('data', d => {
      if (!d || peer !== este) return;
      if (d.t === 'bem') {
        clearTimeout(limite);
        modo = 'convidado'; p.id = d.id; jogadores = [p]; assinatura = '';
        estado = 'sala'; renderPainel();
      } else if (d.t === 'cheia') {
        clearTimeout(limite); erroRede('Essa sala já tá lotada, com 4 coveiros.');
      } else if (d.t === 'mundo' && modo === 'convidado') aplicarMundo(d);
    });
    conn.on('close', () => { if (peer === este && modo === 'convidado') { modo = 'solo'; estado = 'conexao'; mostrarMensagem('Quem criou a sala saiu', 'Ou caiu da internet. Sem ele a partida acaba pra todo mundo.', 'Voltar'); } });
  });
  este.on('error', e => {
    if (peer !== este) return;
    if (modo === 'convidado') { avisoLocal('A conexão tá instável (' + e.type + ').'); return; }
    clearTimeout(limite);
    erroRede(e.type === 'peer-unavailable' ? `Não achei a sala ${codigo}. Confere o código ou pede um link novo.` : `Não deu pra conectar (${e.type}). Tenta de novo.`);
  });
}

function enviarEntrada(ja) {
  if (!conexaoAnfitriao || !conexaoAnfitriao.open) return;
  const agora = performance.now();
  if (!ja && agora - ultimoEnvio < 50) return;
  ultimoEnvio = agora;
  try {
    conexaoAnfitriao.send({ t: 'in', n: p.nome, x: Math.round(p.x), y: Math.round(p.y), dir: r2(p.dir), an: p.andando ? 1 : 0, seg: segurando() ? 1 : 0, a: p.acaoSeq, l: p.lampSeq, c: [p.compraSeq, p.compraItem] });
  } catch (e) { /* conexão caindo */ }
}

function aplicarMundo(m) {
  const antes = estado;
  estado = m.estado; dia = m.dia; dinheiro = m.dinheiro; meta = m.meta; relogio = m.relogio;
  nivelFerr = m.nivelFerr; nivelBota = m.nivelBota || 0; estoque = m.estoque; tipoFim = m.tipoFim; stats = m.stats; codigoSala = m.codigo;
  fila = m.fila; lampioes = m.lampioes;
  dono = m.dono.slice(); ajustarAreas(dono.length);
  evento = m.evento ? { tipo: m.evento[0], etapa: m.evento[1], frente: m.evento[2] } : null;
  moedas = (m.moedas || []).map(v => ({ id: v[0], x: v[1], y: v[2], ox: v[3], oy: v[4], t: v[5] }));
  perigos = (m.perigos || []).map(v => ({ tipo: v[0], x: v[1], y: v[2], ox: v[3], oy: v[4], t: v[5], dur: v[6] }));
  m.covas.forEach((v, i) => {
    const c = covas[i];
    if (!c) return;
    if (!v) { Object.assign(c, { prof: 0, corpo: null, fechada: false, fechar: 0, enfeite: null, levantou: false, levantarEm: null, pago: false }); return; }
    Object.assign(c, { prof: v[0], corpo: v[1], fechada: !!v[2], fechar: v[3], enfeite: v[4], levantou: !!v[5], levantarEm: v[6] ? 1 : null, pago: !!v[7] });
  });
  const velhos = new Map(inimigos.map(e => [e.id, e]));
  inimigos = m.inimigos.map(v => {
    const e = velhos.get(v[0]) || { x: v[3], y: v[4] };
    return Object.assign(e, { id: v[0], tipo: v[1], especie: v[2], alvoX: v[3], alvoY: v[4], r: v[5], vida: v[6], estado: v[7], prog: v[8], saque: v[9], dir: v[10], flash: v[11] ? .1 : 0, vidaMax: v[12] || v[6] });
  });
  const velhosJ = new Map(jogadores.map(q => [q.id, q]));
  const comecou = (antes === 'sala' || antes === 'fim') && estado === 'dia';
  jogadores = m.jogadores.map(v => {
    const eu = v[0] === p.id;
    if (eu && comecou) { p.x = v[3]; p.y = v[4]; }
    const q = eu ? p : (velhosJ.get(v[0]) || Object.assign(novoJogador(v[0], v[1], v[2]), { x: v[3], y: v[4] }));
    Object.assign(q, { cor: corSegura(v[2]), carrega: v[6], vida: v[7], caido: !!v[8], golpe: v[9] ? .1 : 0, trabalhando: !!v[10], inv: v[12] ? .5 : 0 });
    if (!eu) Object.assign(q, { nome: limparNome(v[1]), alvoX: v[3], alvoY: v[4], dir: v[5], andando: !!v[11] });
    return q;
  });
  if (!jogadores.includes(p)) jogadores.push(p);
  (m.ev || []).forEach(ev => {
    if (ev.para && ev.para !== p.id) return;
    if (ev.exceto && ev.exceto === p.id) return;
    if (ev.f) flutuantes.push({ x: ev.f[0], y: ev.f[1], txt: String(ev.f[2]), cor: corSegura(ev.f[3]), t: 0 });
    if (Array.isArray(ev.s)) tocarLocal(String(ev.s[0]), ev.s[1] == null ? null : +ev.s[1] || 0);
    if (ev.fx && ['rosa', 'fumaca', 'explosao'].includes(ev.fx[0])) efeitoLocal(ev.fx[0], +ev.fx[1] || 0, +ev.fx[2] || 0);
    if (ev.a) avisoLocal(String(ev.a));
    if (ev.tr && config.tremor) tremor = Math.max(tremor, +ev.tr || 0);
  });
  if (antes !== estado && (antes === 'dia' || antes === 'noite')) soltar();
  const sig = [estado, dia, dinheiro, nivelFerr, nivelBota, estoque, tipoFim, stats.ganho, stats.roubado, stats.recuperado, jogadores.map(q => q.nome + q.cor).join(',')].join('|');
  if (sig === assinatura) return;
  assinatura = sig;
  if (estado === 'dia' || estado === 'noite') { if (!$('#painel').hidden) esconderPainel(); }
  else renderPainel();
}

function suavizar(dt) {
  const k = Math.min(1, dt * 12);
  const aproxima = o => {
    if (o.alvoX == null) return;
    if (Math.hypot(o.alvoX - o.x, o.alvoY - o.y) > 90) { o.x = o.alvoX; o.y = o.alvoY; return; }
    o.x += (o.alvoX - o.x) * k; o.y += (o.alvoY - o.y) * k;
  };
  inimigos.forEach(aproxima);
  jogadores.forEach(q => { if (q !== p) aproxima(q); });
}

function copiarLink() {
  const b = $('[data-acao=copiar]');
  const selecionar = () => {
    const el = $('#link-sala');
    if (!el) return;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    if (b) b.textContent = 'Selecionado. Copia com Ctrl+C';
  };
  try { navigator.clipboard.writeText(linkSala()).then(() => { if (b) b.textContent = 'Link copiado'; }, selecionar); }
  catch (e) { selecionar(); }
}

// ===== Desenho =====
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circulo(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function sombra(x, y, rx, ry) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function contorno(w) { ctx.strokeStyle = COR.tinta; ctx.lineWidth = w; ctx.stroke(); }
function texto(s, x, y, tam, cor, peso = 600) {
  ctx.font = `${peso} ${tam}px Fredoka, "Segoe UI", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 3.5; ctx.strokeStyle = COR.tinta; ctx.strokeText(s, x, y);
  ctx.fillStyle = cor; ctx.fillText(s, x, y);
}

// O chão é assado em pedaços de 480 px, sob demanda, para o mundo crescer sem limite.
// Cada pedaço desenha também as manchas dos vizinhos, para não ficar emenda.
const PEDACO = 480, pedacos = new Map();
function detalhesChao(g, j) {
  const rng = mulberry(11 + j * 7919), x0 = j * PEDACO;
  for (let i = 0; i < 120; i++) {
    g.fillStyle = rng() < .5 ? 'rgba(138,168,92,.16)' : 'rgba(36,58,28,.16)';
    g.beginPath(); g.ellipse(x0 + rng() * PEDACO, rng() * H, 12 + rng() * 44, 8 + rng() * 26, rng() * 3, 0, TAU); g.fill();
  }
  g.fillStyle = 'rgba(60,42,26,.35)';
  for (let i = 0; i < 90; i++) {
    const vertical = j === 0 && rng() < .55;
    const x = vertical ? 170 + rng() * 30 : Math.max(170, x0) + rng() * (x0 + PEDACO - Math.max(170, x0));
    const y = vertical ? 34 + rng() * (H - 34) : (rng() < .5 ? 204 : 354) + rng() * 22;
    g.beginPath(); g.arc(x, y, .8 + rng() * 1.6, 0, TAU); g.fill();
  }
  g.strokeStyle = 'rgba(32,52,26,.55)'; g.lineWidth = 1.3; g.lineCap = 'round';
  for (let i = 0; i < 190; i++) {
    const x = x0 + rng() * PEDACO, y = 42 + rng() * (H - 42);
    if (x > 164 && x < 206) continue;
    if (x > 164 && ((y > 198 && y < 232) || (y > 348 && y < 382))) continue;
    g.beginPath(); g.moveTo(x - 3, y - 4); g.lineTo(x, y); g.lineTo(x + 3, y - 5); g.moveTo(x, y); g.lineTo(x, y - 6); g.stroke();
  }
}
function pedacoChao(k) {
  let c = pedacos.get(k);
  if (c) return c;
  if (pedacos.size > 8) pedacos.delete(pedacos.keys().next().value);
  const x0 = k * PEDACO, larg = PEDACO + 2;
  c = document.createElement('canvas'); c.width = larg * 2; c.height = H * 2;
  const g = c.getContext('2d'); g.scale(2, 2); g.translate(-x0, 0);
  g.fillStyle = '#5b7a42'; g.fillRect(x0, 0, larg, H);
  g.fillStyle = 'rgba(139,106,70,.78)';
  if (k === 0) g.fillRect(170, 34, 30, H - 34);
  const px = Math.max(170, x0);
  if (px < x0 + larg) { g.fillRect(px, 204, x0 + larg - px, 22); g.fillRect(px, 354, x0 + larg - px, 22); }
  for (let j = k - 1; j <= k + 1; j++) if (j >= 0) detalhesChao(g, j);
  g.fillStyle = '#4a4453'; g.fillRect(x0, 0, larg, 34);
  g.strokeStyle = 'rgba(22,19,28,.55)'; g.lineWidth = 1.5;
  for (let row = 0; row < 2; row++) for (let x = Math.floor(x0 / 36) * 36 - (row ? 18 : 0); x < x0 + larg; x += 36) g.strokeRect(x + .5, row * 15 + 2.5, 36, 15);
  g.fillStyle = '#3a3542'; g.fillRect(x0, 32, larg, 4);
  if (k === 0) {
    g.fillStyle = '#2a2531'; g.fillRect(58, 0, 76, 36);
    g.strokeStyle = '#16131c'; g.lineWidth = 2;
    for (let x = 62; x < 134; x += 8) { g.beginPath(); g.moveTo(x, 2); g.lineTo(x, 36); g.stroke(); }
  }
  pedacos.set(k, c);
  return c;
}
const luz = document.createElement('canvas'); luz.width = W; luz.height = H;
const lg = luz.getContext('2d');

const naTela = (x, m = 80) => x > camDesenho - m && x < camDesenho + W + m;

function desenharAreas() {
  AREAS.forEach((a, i) => {
    if (!naTela(a.x + a.w / 2, a.w)) return;
    if (dono[i]) { rr(a.x, a.y, a.w, a.h, 12); ctx.strokeStyle = 'rgba(22,19,28,.2)'; ctx.lineWidth = 2; ctx.stroke(); return; }
    rr(a.x, a.y, a.w, a.h, 12); ctx.fillStyle = 'rgba(16,13,20,.42)'; ctx.fill();
    ctx.setLineDash([10, 8]); rr(a.x + 4, a.y + 4, a.w - 8, a.h - 8, 10);
    ctx.strokeStyle = COR.madeiraEsc; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
    const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
    ctx.fillStyle = COR.tinta; ctx.fillRect(cx - 3, cy + 10, 6, 34);
    rr(cx - 52, cy - 30, 104, 48, 6); ctx.fillStyle = COR.madeira; ctx.fill(); contorno(2.5);
    texto('À venda', cx, cy - 13, 13, COR.osso, 500);
    texto(`$${CFG.precoTerreno(i)}`, cx, cy + 6, 19, COR.ambar, 700);
  });
}

function desenharRosa(x, y, s = 1) {
  ctx.strokeStyle = '#3f6b2c'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y + 8 * s); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = '#4f8a36'; ctx.beginPath(); ctx.ellipse(x + 3 * s, y + 5 * s, 3 * s, 1.6 * s, -.5, 0, TAU); ctx.fill();
  circulo(x, y - s, 4.6 * s); ctx.fillStyle = '#c8323c'; ctx.fill(); contorno(1.4);
  ctx.strokeStyle = '#8e1d27'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y - s, 2.2 * s, .5, 4.5); ctx.stroke();
}

function desenharVela(x, y, s = 1, apagada = false) {
  rr(x - 3 * s, y - 5 * s, 6 * s, 12 * s, 1.5 * s); ctx.fillStyle = '#f3ecd9'; ctx.fill(); contorno(1.4);
  if (apagada) {
    ctx.strokeStyle = COR.tinta; ctx.lineWidth = 1.4 * s;
    ctx.beginPath(); ctx.moveTo(x, y - 5 * s); ctx.lineTo(x + s, y - 8 * s); ctx.stroke();
    const k = (tempo * .7 + x * .01) % 1;
    ctx.strokeStyle = `rgba(200,198,210,${.45 * (1 - k)})`; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const yy = y - 9 * s - i * 2.2 - k * 6; ctx.lineTo(x + Math.sin(i * 1.3 + tempo * 3) * 2, yy); }
    ctx.stroke();
    return;
  }
  const f = 1 + Math.sin(tempo * 18 + x) * .12, inclina = ventoVis * 2.5 * s;
  ctx.fillStyle = COR.ambar; ctx.beginPath(); ctx.ellipse(x + inclina, y - 9 * s, 2.4 * s, 4 * s * f, ventoVis * .5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.ellipse(x + inclina * .8, y - 8.4 * s, 1 * s, 2 * s * f, ventoVis * .5, 0, TAU); ctx.fill();
}

function desenharCorpo(x, y, especie, ang = 0, s = 1) {
  const og = especie === 'ogro', w = (og ? 80 : 64) * s, h = (og ? 30 : 22) * s;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-w / 2 + 3, -h / 2 + 4, w, h, h / 2); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = COR.mortalha; ctx.fill(); contorno(2.2);
  ctx.strokeStyle = 'rgba(22,19,28,.35)'; ctx.lineWidth = 1.5;
  for (let i = 1; i <= 3; i++) {
    const bx = -w / 2 + w * (.28 + i * .17);
    ctx.beginPath(); ctx.moveTo(bx, -h / 2 + 2); ctx.lineTo(bx - 4 * s, h / 2 - 2); ctx.stroke();
  }
  const rx = -w / 2 + h * .55, rr_ = h * .38;
  circulo(rx, 0, rr_); ctx.fillStyle = og ? '#8aa65e' : '#dcc7a4'; ctx.fill(); contorno(1.8);
  ctx.strokeStyle = COR.tinta; ctx.lineWidth = 1.3;
  [-1, 1].forEach(sg => {
    const ex = rx + rr_ * .25, ey = sg * rr_ * .42, k = rr_ * .22;
    ctx.beginPath(); ctx.moveTo(ex - k, ey - k); ctx.lineTo(ex + k, ey + k); ctx.moveTo(ex + k, ey - k); ctx.lineTo(ex - k, ey + k); ctx.stroke();
  });
  if (og) {
    ctx.fillStyle = COR.osso;
    [-1, 1].forEach(sg => { ctx.beginPath(); ctx.moveTo(rx + rr_ * .7, sg * rr_ * .25); ctx.lineTo(rx + rr_ * 1.25, sg * rr_ * .35); ctx.lineTo(rx + rr_ * .7, sg * rr_ * .55); ctx.closePath(); ctx.fill(); });
  }
  ctx.restore();
}

function balao(x, y, item) {
  y += Math.sin(tempo * 3 + x) * 1.5;
  ctx.fillStyle = COR.osso;

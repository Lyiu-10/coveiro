<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coveiro</title>
    <!-- Página da versão web: o jogo ocupa a janela inteira. Gerada pelo Ferramentas.GerarWeb -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #16131c; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #16131c; outline: none; }
      #carregando {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #efe6d2; font: 600 20px system-ui, sans-serif;
      }
      #barra { width: 240px; height: 8px; margin-top: 14px; border-radius: 4px; background: #2c2536; overflow: hidden; }
      #cheio { width: 0; height: 100%; background: #f2b544; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carregando">Coveiro<div id="barra"><div id="cheio"></div></div></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Coveiro",
        productName: "Coveiro",
        productVersion: "0.1.0",
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#cheio").style.width = 100 * p + "%";
        }).then(function (u) {
          window.unityInstance = u;
          document.querySelector("#carregando").remove();
          canvas.focus();
        }).catch(function (e) {
          document.querySelector("#carregando").textContent = "Não abriu: " + e;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
